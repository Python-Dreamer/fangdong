<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>实用工具箱 - 瑞丽房东管家</title>
<link rel="icon" type="image/jpeg" href="birthday_icon.jpg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --p: #6366f1; --p-light: #818cf8; --p-dark: #4f46e5;
  --g: #10b981; --o: #f97316; --d: #ef4444;
  --bg: #f1f5f9; --c: #fff; --t: #1e293b; --ts: #64748b; --bd: #e2e8f0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--t); min-height: 100vh;
  padding-bottom: 40px;
}
.header {
  background: linear-gradient(135deg, var(--p) 0%, #7c3aed 100%);
  color: #fff; padding: 32px 20px 28px; text-align: center;
}
.header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: .85; }
.container { max-width: 600px; margin: 0 auto; padding: 0 16px; margin-top: -16px; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.tool-card {
  background: var(--c); border-radius: 14px; padding: 20px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); cursor: pointer;
  transition: .2s; text-decoration: none; color: var(--t);
  display: flex; flex-direction: column; align-items: center;
  text-align: center; border: 2px solid transparent;
}
.tool-card:hover, .tool-card:active {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(99,102,241,.15);
  border-color: var(--p-light);
}
.tool-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin-bottom: 12px;
}
.tool-icon.purple { background: #ede9fe; }
.tool-icon.orange { background: #fff7ed; }
.tool-icon.green { background: #ecfdf5; }
.tool-icon.blue { background: #eff6ff; }
.tool-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.tool-card p { font-size: 11px; color: var(--ts); line-height: 1.4; }
.section-label {
  font-size: 12px; color: var(--ts); font-weight: 600;
  padding: 8px 4px; text-transform: uppercase; letter-spacing: .5px;
}
.coming-soon {
  background: repeating-linear-gradient(45deg,#f8fafc,#f8fafc 10px,#f1f5f9 10px,#f1f5f9 20px);
  opacity: .7; cursor: default; pointer-events: none;
}
.coming-soon .tool-icon { opacity: .5; }
.coming-soon h3::after {
  content: '敬请期待'; display: block; font-size: 10px;
  color: var(--p); font-weight: 600; margin-top: 2px;
}
.back-link {
  display: inline-flex; align-items: center; gap: 4px;
  color: rgba(255,255,255,.8); font-size: 13px; text-decoration: none;
  position: absolute; top: 16px; left: 16px;
}
.back-link:hover { color: #fff; }
.notice {
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 16px; font-size: 12px; color: #92400e;
  display: flex; gap: 8px; align-items: flex-start;
}
.notice-icon { font-size: 16px; flex-shrink: 0; }
.footer {
  text-align: center; padding: 24px 12px; font-size: 12px; color: var(--ts);
}
.footer a { color: var(--ts); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-link">‹ 返回</a>
  <h1>🧰 实用工具箱</h1>
  <p>拍照转文档 · 生日管理 · 更多工具持续添加</p>
</div>

<div class="container">
  <div class="notice">
    <span class="notice-icon">🔒</span>
    <div>所有工具均在浏览器本地运行，文件不会上传到服务器，保护您的隐私。</div>
  </div>

  <div class="section-label">常用工具</div>
  <div class="tool-grid">
    <a href="image_converter.html" class="tool-card">
      <div class="tool-icon purple">📄</div>
      <h3>拍照转文档</h3>
      <p>图片转PDF/Word，多张合并，手机拍照直接用</p>
    </a>
    <a href="birthday_manager.html" class="tool-card">
      <div class="tool-icon orange">🎂</div>
      <h3>生日台账</h3>
      <p>记录生日，自动倒计时提醒</p>
    </a>
  </div>

  <div class="section-label">即将上线</div>
  <div class="tool-grid">
    <div class="tool-card coming-soon">
      <div class="tool-icon green">🖼️</div>
      <h3>图片压缩</h3>
      <p>批量压缩图片大小</p>
    </div>
    <div class="tool-card coming-soon">
      <div class="tool-icon blue">📝</div>
      <h3>文字识别</h3>
      <p>图片中提取文字</p>
    </div>
  </div>
</div>

<div class="footer">
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">滇ICP备2026014743号</a>
</div>

</body>
</html>
