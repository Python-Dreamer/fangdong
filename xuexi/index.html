<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐱 萌宠学园V7</title>
<style>
:root{--p:#6C63FF;--pl:#8B83FF;--s:#FF6B8A;--a:#FFB347;--ok:#4CAF50;--no:#FF5252;--bg:#FFF8F0;--c:#FFF;--t:#333;--tl:#888;--r:16px;--sh:0 4px 15px rgba(0,0,0,.08);--garden:#E8F5E9;--grass:#81C784}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;padding-bottom:80px}
body.eye-warm{--bg:#FFF3E0;filter:sepia(0.05)}
/* === V7 Page transitions with spring === */
.pg{display:none;padding:16px;max-width:480px;margin:0 auto}.pg.on{display:block;animation:springIn .5s cubic-bezier(0.68,-0.55,0.27,1.55)}
@keyframes springIn{0%{opacity:0;transform:scale(0.92) translateX(20px)}60%{transform:scale(1.02) translateX(-3px)}100%{opacity:1;transform:scale(1) translateX(0)}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sk{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes tw{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
@keyframes hf{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes ff{0%{transform:translate(-80px,-40px);opacity:0}50%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes yr{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(100px) rotate(720deg)}}
@keyframes bf{0%{opacity:0;transform:scale(0)}50%{opacity:1}100%{transform:translateY(-20px)}}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes csk{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
@keyframes et{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(-5deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sway2{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.05)}}
@keyframes sparkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes heartFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.5)}}
@keyframes starBurst{0%{opacity:1;transform:scale(0)}50%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(2)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 5px rgba(108,99,255,.3)}50%{box-shadow:0 0 20px rgba(108,99,255,.6)}}
@keyframes growIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wilt{to{filter:grayscale(1);opacity:.5;transform:rotate(10deg)}}
/* === V7 New Animations === */
@keyframes rippleEffect{to{transform:scale(4);opacity:0}}
@keyframes staggerIn{from{opacity:0;transform:translateY(30px) scale(0.8)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes starFly{0%{opacity:1;transform:translate(0,0) scale(1)}50%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(0.6)}100%{opacity:0;transform:translate(var(--ex),var(--ey)) scale(0.3)}}
@keyframes gentleShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
@keyframes starExplosion{0%{opacity:1;transform:scale(0) rotate(0)}30%{opacity:1;transform:scale(1.2) rotate(90deg)}100%{opacity:0;transform:scale(2) rotate(360deg)}}
@keyframes fireworkShoot{0%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-40vh) scale(0.8)}100%{opacity:0;transform:translateY(-50vh) scale(0)}}
@keyframes fireworkBurst{0%{opacity:1;transform:scale(0)}50%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes chestBounce{0%{transform:scale(0) rotate(-10deg)}50%{transform:scale(1.15) rotate(5deg)}70%{transform:scale(0.95) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes coinFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--cx),var(--cy)) scale(0.3)}}
@keyframes comboFlash{0%,100%{opacity:0}50%{opacity:0.3}}
@keyframes mouthOpen{0%,100%{ry:2}50%{ry:8}}
@keyframes toneLine{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes writeStroke{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes wheelSpin{0%{transform:rotate(0)}100%{transform:rotate(var(--rot))}}
@keyframes floatUp{0%{opacity:0;transform:translateY(100vh)}10%{opacity:0.6}90%{opacity:0.6}100%{opacity:0;transform:translateY(-20px)}}
@keyframes pinduMerge{0%{transform:translateX(var(--sx))}60%{transform:translateX(0) scale(1.1)}100%{transform:translateX(0) scale(1)}}
@keyframes badgeUnlock{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes progressBounce{0%{transform:scaleX(1)}50%{transform:scaleX(1.02)}100%{transform:scaleX(1)}}
@keyframes slideBanner{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes welcomeCat{0%{transform:translateX(-120px) scaleX(-1);opacity:0}40%{transform:translateX(0) scaleX(-1);opacity:1}60%{transform:translateX(-10px) scaleX(-1)}100%{transform:translateX(0) scaleX(-1);opacity:1}}
@keyframes welcomeTitle{0%{opacity:0;transform:translateY(30px) scale(0.8)}60%{opacity:1;transform:translateY(-5px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes taskComplete{0%{transform:translateY(0) scale(1);opacity:1}30%{transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-60px) scale(0.8);opacity:0}}
/* === V7 Ripple Button === */
.btn{position:relative;overflow:hidden;padding:12px 24px;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(0.93)}
.btn .ripple-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.4);transform:scale(0);animation:rippleEffect 0.6s ease-out;pointer-events:none}
.bp{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff}.bs{background:#eee;color:var(--t)}.bg{background:var(--ok);color:#fff}
/* === V7 Touch feedback === */
.op{transition:transform .15s,box-shadow .15s,border-color .2s,background .2s}.op:active{transform:scale(0.93)!important}
.mc:active{transform:scale(0.93)!important;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.li:active{transform:scale(0.97)!important}
/* === Stagger for level cards === */
.li{opacity:0;animation:staggerIn .4s ease forwards}
.li:nth-child(1){animation-delay:0.05s}.li:nth-child(2){animation-delay:0.1s}.li:nth-child(3){animation-delay:0.15s}
.li:nth-child(4){animation-delay:0.2s}.li:nth-child(5){animation-delay:0.25s}.li:nth-child(6){animation-delay:0.3s}
.li:nth-child(7){animation-delay:0.35s}.li:nth-child(8){animation-delay:0.4s}.li:nth-child(9){animation-delay:0.45s}
.li:nth-child(10){animation-delay:0.5s}
/* === Gentle shake for wrong answer === */
.shake-it{animation:gentleShake .4s ease}
/* === HD === */
.hd{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;padding:16px;text-align:center;border-radius:0 0 24px 24px}
.hd h1{font-size:20px;margin-bottom:4px}.hd .sb{font-size:13px;opacity:.85}
.sb2{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.si{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:3px}
/* === V7 Daily Banner === */
.daily-banner{background:linear-gradient(135deg,#FFF9C4,#FFECB3);border-radius:12px;padding:10px 14px;margin-top:12px;display:flex;align-items:center;gap:10px;animation:slideBanner .5s ease;box-shadow:0 2px 8px rgba(255,179,0,.15)}
.daily-banner .db-icon{font-size:24px;flex-shrink:0}.daily-banner .db-text{font-size:12px;color:#F57F17;font-weight:500;flex:1}
/* === V7 Sound toggle === */
.sound-toggle{position:fixed;top:12px;right:12px;z-index:120;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.sound-toggle:active{transform:scale(0.9)}
/* === Nav === */
.bn2{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.ni{display:flex;flex-direction:column;align-items:center;padding:4px 8px;cursor:pointer;border:none;background:none;font-size:10px;color:var(--tl);transition:color .2s}.ni:active{transform:scale(0.9)}.ni.ac{color:var(--p)}.ni .ic{font-size:22px;margin-bottom:2px}
/* === Module grid === */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mc{background:var(--c);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s}.mc:active{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mc .mi{font-size:40px;margin-bottom:8px}.mc .mn{font-size:15px;font-weight:600;margin-bottom:4px}.mc .md{font-size:11px;color:var(--tl)}
.mp{margin-top:8px;height:6px;background:#eee;border-radius:3px;overflow:hidden}.mpf{height:100%;border-radius:3px;transition:width .5s cubic-bezier(0.68,-0.55,0.27,1.55)}
/* === Levels === */
.lh{text-align:center;margin:16px 0}.lh h2{font-size:20px;margin-bottom:4px}
.ll{display:flex;flex-direction:column;gap:10px}
.li{background:var(--c);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s}.li.lk{opacity:.5;pointer-events:none}
.ln{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
.lif{flex:1}.lif .lname{font-size:14px;font-weight:600}.lif .ldesc{font-size:11px;color:var(--tl);margin-top:2px}
.ls{display:flex;gap:2px}.ls .st{font-size:16px}.st.e{color:#FFD700}.st.d{color:#DDD}
/* === Quiz === */
.qa{background:var(--c);border-radius:var(--r);padding:20px;margin-top:16px;box-shadow:var(--sh);min-height:280px}
.qp{display:flex;align-items:center;gap:8px;margin-bottom:16px}.qpb{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}.qpf{height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:4px;transition:width .5s cubic-bezier(0.68,-0.55,0.27,1.55)}.qpt{font-size:12px;color:var(--tl);white-space:nowrap}
.qq{font-size:18px;text-align:center;margin:16px 0;line-height:1.6}.qq .bc{font-size:56px;display:block;margin:10px auto}.qq .pm{font-size:48px;color:var(--p);font-weight:700}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{padding:14px;border:2px solid #eee;border-radius:12px;text-align:center;font-size:18px;cursor:pointer;transition:.2s;background:#fff}.op.r{border-color:var(--ok);background:#E8F5E9}.op.w{border-color:var(--no);background:#FFEBEE;animation:sk .3s}.op.dis{pointer-events:none}
.qt{font-size:12px;color:var(--tl);text-align:center;margin-top:8px}
.rs{text-align:center;padding:30px 20px}.rs .ri{font-size:64px;margin-bottom:12px}.rs h2{font-size:22px;margin-bottom:8px}.rs .rst{font-size:36px;margin:12px 0}.rs .rm{font-size:14px;color:var(--tl);margin-bottom:20px}
.bg2{display:flex;gap:10px;justify-content:center;margin-top:12px}
/* === Cat === */
.cc{position:fixed;bottom:75px;right:10px;z-index:90;width:100px;height:120px}
.cw{width:100px;height:120px;cursor:pointer;position:relative}
.cb{position:absolute;bottom:125px;right:-10px;background:#fff;border-radius:16px;padding:8px 12px;font-size:12px;box-shadow:var(--sh);opacity:0;transition:.3s;pointer-events:none;z-index:91;max-width:180px;text-align:center}.cb.show{opacity:1}
.cb::after{content:'';position:absolute;bottom:-8px;right:30px;border:8px solid transparent;border-top-color:#fff}
.ch{position:absolute;top:0;left:50%;pointer-events:none}.cheart{position:absolute;animation:hf 1s forwards;font-size:16px}
.ce{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
/* === Pet page === */
.pp{margin-top:12px;box-shadow:var(--sh)}.pp h3{font-size:16px;margin-bottom:12px;text-align:center}
.ps{display:flex;justify-content:space-around;margin-bottom:16px}.pst{text-align:center}.pst .pi{font-size:24px}.pst .pbar{width:60px;height:6px;background:#eee;border-radius:3px;margin:4px auto;overflow:hidden}.pst .pfill{height:100%;border-radius:3px;transition:width .3s}.pst .pvl{font-size:10px;color:var(--tl)}
.pa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pac{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;border:2px solid #eee;cursor:pointer;background:#fff;font-size:11px;transition:transform .15s}.pac:active{transform:scale(.93)}.pac .pai{font-size:24px;margin-bottom:4px}.pac .pcost{font-size:9px;color:var(--a)}
/* === Daily task === */
.dt{margin-top:16px}.dt h3{font-size:16px;margin-bottom:10px}
.ti{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-radius:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;overflow:hidden;transition:transform .2s}
.tc{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}.tc.dn{background:var(--ok);border-color:var(--ok);color:#fff}.tt{flex:1;font-size:13px}.tr{font-size:11px;color:var(--a);font-weight:600}
/* Task complete floating notification */
.task-notif{position:absolute;right:10px;top:-5px;font-size:11px;color:var(--ok);font-weight:700;animation:taskComplete 1.2s ease forwards;pointer-events:none}
/* === Shop === */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.shi{background:var(--c);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh)}.shi .sic{font-size:36px;margin-bottom:6px}.shi .sin{font-size:13px;font-weight:600}.shi .sip{font-size:12px;color:var(--a);margin:4px 0}
.sp{background:var(--c);border-radius:var(--r);padding:20px;margin-top:12px;box-shadow:var(--sh)}.spt{text-align:center;font-size:18px;font-weight:700;margin-bottom:4px}.spc{font-size:16px;line-height:2;margin-bottom:16px}.spi{text-align:center;font-size:48px;margin:10px 0}
/* === Dr. tip === */
.dg{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(135deg,#E8EAF6,#F3E5F5);border-radius:16px;padding:12px;margin:12px 0}
.da{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--p),#9C27B0);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.dtx{flex:1;font-size:13px;line-height:1.6}.dtx .dn{font-weight:700;color:var(--p);font-size:12px}
.bb{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border:none;background:rgba(0,0,0,.05);border-radius:20px;font-size:13px;cursor:pointer;margin-bottom:8px;color:var(--t);transition:background .2s}.bb:active{background:rgba(0,0,0,.1)}
.pt{background:linear-gradient(135deg,#FFF3E0,#FFF8E1);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:12px;line-height:1.6}.pt strong{color:var(--a)}
/* === Level up overlay === */
.luo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}.luo.show{display:flex}.lub{background:#fff;border-radius:24px;padding:30px;text-align:center;max-width:300px;animation:bn .5s}.lub h2{font-size:24px;color:var(--p);margin:10px 0}.lub .lui{font-size:64px}.lub .lud{font-size:14px;color:var(--tl);margin-bottom:16px}
/* === Celebration === */
.celebration{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:250;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .3s}.celebration.show{opacity:1;pointer-events:auto}
.celeb-content{text-align:center;animation:growIn .5s ease}
.celeb-content .celeb-emoji{font-size:80px}
.celeb-content h2{color:#fff;font-size:24px;margin-top:12px}
.celeb-content p{color:rgba(255,255,255,.8);font-size:14px;margin-top:8px}
/* === V7 Welcome overlay === */
.welcome-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#EDE7F6,#E8EAF6,#E3F2FD);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.welcome-overlay.hide{opacity:0;pointer-events:none}
.welcome-cat{animation:welcomeCat 1.5s ease-out forwards}
.welcome-title{animation:welcomeTitle 0.8s ease-out 0.8s both;font-size:28px;font-weight:800;color:var(--p);text-align:center;margin-top:16px}
.welcome-sub{animation:welcomeTitle 0.8s ease-out 1.2s both;font-size:14px;color:var(--tl);margin-top:8px}
/* === V7 Login reward === */
.login-reward-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:280;display:none;align-items:center;justify-content:center}
.login-reward-overlay.show{display:flex}
.login-reward-box{text-align:center;animation:chestBounce .8s ease}
.login-reward-box .chest{font-size:80px;display:block;margin-bottom:12px}
.login-reward-box h2{color:#FFD700;font-size:22px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.login-reward-box .reward-info{color:#fff;font-size:16px;margin:12px 0}
.login-reward-box .reward-streak{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px}
/* === V7 Combo display === */
.combo-display{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:130;font-size:20px;font-weight:800;color:#FFD700;text-shadow:0 2px 6px rgba(255,215,0,.5);opacity:0;transition:opacity .3s;pointer-events:none}
.combo-display.show{opacity:1;animation:bn .5s}
/* === V7 Combo edge flash === */
.combo-flash{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:125;border:4px solid #FFD700;border-radius:0;opacity:0}
.combo-flash.show{animation:comboFlash .4s ease 3}
/* === V7 Background particles === */
.bg-particles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-particle{position:absolute;font-size:14px;opacity:0.4;animation:floatUp var(--dur) linear infinite;animation-delay:var(--delay)}
/* === V7 Mouth animation === */
.mouth-anim{display:inline-block;width:32px;height:32px;position:relative;vertical-align:middle}
.mouth-anim svg{width:32px;height:32px}
/* === V7 Tone visualization === */
.tone-vis{display:flex;justify-content:center;gap:16px;margin:12px 0}
.tone-vis .tone-item{text-align:center;cursor:pointer;padding:8px;border-radius:12px;transition:background .2s,transform .15s}
.tone-vis .tone-item:active{transform:scale(0.9)}
.tone-vis .tone-item.selected{background:rgba(108,99,255,.1)}
.tone-vis .tone-char{font-size:32px;font-weight:700}
.tone-vis .tone-mark{font-size:14px;color:var(--tl);margin-top:4px}
.tone-vis .tone-svg{width:40px;height:30px;margin:4px auto}
/* === V7 Writing animation === */
.write-anim{text-align:center;margin:16px 0;position:relative}
.write-anim svg{width:120px;height:80px}
.write-anim .stroke-path{stroke:var(--p);stroke-width:3;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:writeStroke 1.5s ease forwards;stroke-linecap:round}
/* === V7 Pindu merge animation === */
.pindu-anim{display:flex;align-items:center;justify-content:center;gap:0;font-size:36px;font-weight:700;margin:16px 0;position:relative;height:60px}
.pindu-anim .p-part{display:inline-block;animation:pinduMerge .8s ease forwards}
.pindu-anim .p-plus{margin:0 12px;font-size:24px;color:var(--tl)}
.pindu-anim .p-result{color:var(--p);font-size:48px;opacity:0;animation:growIn .5s ease .8s forwards}
/* === V7 Tone wheel === */
.tone-wheel-wrap{text-align:center;margin:16px 0;position:relative}
.tone-wheel{width:200px;height:200px;border-radius:50%;border:4px solid var(--p);margin:0 auto;position:relative;overflow:hidden;transition:transform 3s cubic-bezier(0.2,0.8,0.3,1)}
.tone-wheel .tw-seg{position:absolute;width:50%;height:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:rgba(108,99,255,.05)}
.tone-wheel-pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:24px;z-index:2}
/* === V7 Achievement badges === */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.badge-item{text-align:center;padding:12px 8px;border-radius:12px;border:2px solid #eee;background:#fff;transition:transform .2s}
.badge-item.unlocked{border-color:#FFD700;background:linear-gradient(135deg,#FFF8E1,#FFFDE7);animation:badgeUnlock .6s ease}
.badge-item.locked{opacity:.4;filter:grayscale(1)}
.badge-item .badge-icon{font-size:32px;display:block;margin-bottom:4px}
.badge-item .badge-name{font-size:11px;font-weight:600;color:var(--t)}
.badge-item .badge-desc{font-size:9px;color:var(--tl);margin-top:2px}
/* === V7 Daily challenge banner === */
.challenge-banner{background:linear-gradient(135deg,#E8EAF6,#F3E5F5);border:2px solid var(--p);border-radius:var(--r);padding:12px;margin-top:12px;text-align:center;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.challenge-banner:active{transform:scale(0.97)}
.challenge-banner .ch-title{font-size:14px;font-weight:700;color:var(--p)}
.challenge-banner .ch-desc{font-size:12px;color:var(--tl);margin-top:4px}
.challenge-banner .ch-reward{font-size:11px;color:var(--a);margin-top:4px;font-weight:600}
/* === Garden === */
.garden-sec{margin-top:16px;background:linear-gradient(135deg,#C8E6C9,#E8F5E9);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.garden-sec h3{font-size:15px;margin-bottom:12px;text-align:center}
.garden-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.garden-cell{background:rgba(255,255,255,.6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;height:60px;position:relative;border:2px dashed rgba(129,199,132,.4)}
.garden-cell.has{border:2px solid var(--grass);background:rgba(255,255,255,.9);animation:growIn .5s ease}
.garden-cell.has span{animation:sway 2s ease-in-out infinite;display:inline-block}
.garden-cell.wilt span{animation:wilt 1s forwards}
.garden-cell .cell-label{position:absolute;bottom:2px;font-size:8px;color:var(--tl)}
.big-garden .garden-grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
/* === Home cat === */
.home-cat{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#F3E5F5,#E8EAF6);border-radius:var(--r);padding:12px;margin-top:12px;box-shadow:var(--sh)}
.home-cat-info{flex:1}.home-cat-info .hcn{font-size:14px;font-weight:600;color:var(--p)}.home-cat-info .hcm{font-size:11px;color:var(--tl);margin-top:2px}
.home-cat .mood-bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}
.home-cat .mood-fill{height:100%;border-radius:3px;transition:width .5s}
.dtask-prog{margin-top:12px;background:var(--c);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.dtask-prog h3{font-size:14px;margin-bottom:8px}
.dtp-bar{height:10px;background:#eee;border-radius:5px;overflow:hidden}
.dtp-fill{height:100%;background:linear-gradient(90deg,var(--ok),#81C784);border-radius:5px;transition:width .5s cubic-bezier(0.68,-0.55,0.27,1.55)}
.dtp-text{display:flex;justify-content:space-between;font-size:11px;color:var(--tl);margin-top:4px}
/* === Streak badge === */
.streak-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.streak-badge.shield{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);color:#1565C0}
.streak-badge.rainbow{background:linear-gradient(135deg,#F3E5F5,#E1BEE7);color:#7B1FA2;background-size:200% 200%;animation:rainbow 3s ease infinite}
/* === Achievement page === */
.ach-header{text-align:center;padding:16px;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;border-radius:0 0 24px 24px}
.ach-header h2{font-size:20px;margin-bottom:4px}.ach-header p{font-size:13px;opacity:.85}
.ach-card{background:var(--c);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--sh)}
.ach-card h3{font-size:14px;margin-bottom:10px;color:var(--p)}
.ach-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5}
.ach-row:last-child{border:none}
.ach-label{font-size:13px;color:var(--t)}.ach-val{font-size:15px;font-weight:700;color:var(--p)}
.ach-prog{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:4px;flex:1;margin-left:10px}
.ach-prog-fill{height:100%;border-radius:4px;transition:width .5s}
.ach-row-flex{display:flex;align-items:center;gap:8px;flex:1}
.cat-sparkle{position:absolute;pointer-events:none;font-size:12px;animation:sparkle 1s ease-in-out infinite}
.particles-overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:150;overflow:hidden}
/* === Misc === */
.sbg{background:#F5F5F5;border-radius:12px;padding:10px;margin:8px 0}.sbt{font-size:12px;color:var(--tl);margin-bottom:6px;font-weight:600}.sbc{display:flex;flex-wrap:wrap;gap:6px}.sbi{padding:4px 10px;background:#fff;border-radius:8px;font-size:15px;font-weight:600;border:1px solid #eee}
.mv{font-size:28px;text-align:center;margin:8px 0;letter-spacing:4px}
.psd{text-align:center;margin:20px 0}
.psn{text-align:center;font-size:14px;font-weight:600;color:var(--p);margin-top:8px}
.sq{margin-top:16px}.sq h4{font-size:14px;margin-bottom:10px}
.story-badge{display:inline-block;padding:2px 8px;border-radius:8px;color:#fff;font-size:10px}
/* === Responsive === */
@media(max-width:360px){.mg{gap:8px}.mc{padding:12px}.qo{gap:8px}.cc{width:80px;height:100px;bottom:70px}.cw{width:80px;height:100px}.garden-cell{height:50px;font-size:22px}}
/* === V7 Eye protection auto === */
@media(prefers-color-scheme:dark){body{--bg:#1a1a2e;--c:#252540;--t:#e0e0e0;--tl:#999;--sh:0 4px 15px rgba(0,0,0,.3)}}

function ld(){

    else{
      const s6=localStorage.getItem('ps6');

  ck();
}
function sv(){localStorage.setItem('ps7',JSON.stringify(S));}

function ck(){
const td=new Date().toDateString();
if(S.ld!==td){
  if(S.ld){
    const y=new Date();y.setDate(y.getDate()-1);
    const wasYesterday=(S.ld===y.toDateString());
    S.st=wasYesterday?S.st+1:1;
    if(!wasYesterday && S.shield<=0){wiltGarden();}
    if(S.shield>0)S.shield--;
  }else S.st=1;
  if(S.st>S.maxStreak)S.maxStreak=S.st;
  S.totalDays++;
  S.td={py:0,zs:0,mt:0,en:0,st:0};S.tci=0;S.dd={};S._allDoneToday=false;S.ld=td;S.combo=0;sv();
}
const now=Date.now(),h=(now-S.lct)/36e5;
if(h>2)S.pm=Math.max(0,S.pm-Math.floor(h*2));
S.lct=now;sv();
}

function wiltGarden(){
  let wilted=false;

}

// ===== V7 ENHANCED SPEECH =====
let zhVoice=null,enVoice=null;
function initVoices(){
  if(!('speechSynthesis' in window))return;
  const loadV=()=>{
    const voices=speechSynthesis.getVoices();
    // Prefer high-quality Chinese voices
    const zhPriority=['Tingting','Microsoft Xiaoxiao','Microsoft Yunyang','zh-CN','zh'];
    for(const p of zhPriority){const v=voices.find(v=>v.name.includes(p)||v.lang.startsWith(p.replace('-','')));if(v){zhVoice=v;break;}}
    if(!zhVoice)zhVoice=voices.find(v=>v.lang.startsWith('zh'));
    // Prefer high-quality English voices
    const enPriority=['Samantha','Karen','Daniel','en-US','en-GB'];
    for(const p of enPriority){const v=voices.find(v=>v.name.includes(p));if(v){enVoice=v;break;}}
    if(!enVoice)enVoice=voices.find(v=>v.lang.startsWith('en'));
  };
  loadV();
  if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadV;
}

function spk(t,lang='zh-CN'){
  if(!S.soundOn)return;
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=lang;
  if(lang==='zh-CN'||lang==='zh'){u.rate=0.5;u.pitch=1.1;if(zhVoice)u.voice=zhVoice;}
  else{u.rate=0.7;u.pitch=1.0;if(enVoice)u.voice=enVoice;}
  u.volume=1;
  speechSynthesis.speak(u);
}

// V7 Mouth animation
function showMouthAnim(dur){
  dur=dur||1500;
  const existing=document.querySelector('.mouth-anim');
  if(existing)existing.remove();
  // Find the audio button that was clicked and add mouth next to it
  const btn=document.activeElement;
  if(btn && btn.tagName==='BUTTON'){
    const mouth=document.createElement('span');
    mouth.className='mouth-anim';
    mouth.innerHTML=`<svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="10" ry="6" fill="#FF8A80" stroke="#555" stroke-width="1"><animate attributeName="ry" values="2;8;2" dur="0.4s" repeatCount="indefinite"/></ellipse></svg>`;
    btn.parentNode.insertBefore(mouth,btn.nextSibling);
    setTimeout(()=>mouth.remove(),dur);
  }
}

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(arr,n){const s=shuf(arr);return s.slice(0,Math.min(n,s.length));}

// ===== V7 RIPPLE EFFECT =====
function addRipple(e,el){
  const rect=el.getBoundingClientRect();
  const r=document.createElement('span');
  r.className='ripple-circle';
  const sz=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${(e.clientX||e.touches?.[0]?.clientX||rect.left+rect.width/2)-rect.left-sz/2}px;top:${(e.clientY||e.touches?.[0]?.clientY||rect.top+rect.height/2)-rect.top-sz/2}px;`;
  el.appendChild(r);
  setTimeout(()=>r.remove(),600);
}
document.addEventListener('click',function(e){
  const btn=e.target.closest('.btn,.op,.mc,.pac,.li');
  if(btn)addRipple(e,btn);
});

// ===== V7 DAILY CHALLENGE =====
function getDailyChallenge(){
  const td=new Date().toDateString();
  if(S.dailyChallengeDone===td)return null;
  // Seed from date for consistency
  const seed=td.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const subs=['py','zs','mt','en'];
  const sub=subs[seed%subs.length];
  const mod=MODS.find(m=>m.id===sub);
  const lvIdx=seed%(mod.d.lv?mod.d.lv.length:1);
  const lv=mod.d.lv?mod.d.lv[lvIdx]:null;
  if(!lv)return null;
  return{sub,mod,lv,reward:30};
}

  const el=$('challengeBanner');

// ===== V7 ENHANCED PINYIN QUIZ GENERATION =====
function genPyQ(lv){
cQs=[];
if(lv.tones){
  // V7: Enhanced tone learning with tone selection game
  const tones=['ā á ǎ à','ō ó ǒ ò','ē é ě è','ī í ǐ ì','ū ú ǔ ù','ǖ ǘ ǚ ǜ'];
  const toneMarks=[['ā','á','ǎ','à'],['ō','ó','ǒ','ò'],['ē','é','ě','è'],['ī','í','ǐ','ì'],['ū','ú','ǔ','ù'],['ǖ','ǘ','ǚ','ǜ']];
  const toneNames=['第一声(¯)','第二声(´)','第三声(ˇ)','第四声(`)'];
  lv.ch.forEach((c,i)=>{
    // Type 1: Show pinyin with tone visualization
    cQs.push({t:'tone',c:c,tn:tones[i],ti:i});
    // Type 2: V7 - Listen and select tone (interactive!)
    const correctTone=Math.floor(Math.random()*4);
    cQs.push({t:'toneSelect',c:c,toneIdx:correctTone,toneChar:toneMarks[i][correctTone],options:toneMarks[i]});
  });
  // V7: Add listening quiz
  for(let i=0;i<3;i++){const ri=Math.floor(Math.random()*6);cQs.push({t:'listen',ans:lv.ch[ri],ops:lv.ch});}
}else if(lv.grp){
  lv.gs.forEach(g=>{g.ch.forEach(c=>{
    const ops=shuf([...g.ch]);while(ops.length<4)ops.push(lv.gs[Math.floor(Math.random()*lv.gs.length)].ch[0]);
    cQs.push({t:'pyM',ans:c,ops:shuf([...new Set(ops)].slice(0,4)),tip:g.tp?g.tp[c]||'':''});
  });});
}else if(lv.pd){
  // V7: Enhanced pindu with merge animation
  lv.it.forEach(it=>{cQs.push({t:'pindu',d:it});});
}else if(lv.ch){
  lv.ch.forEach(c=>{const ops=shuf([...lv.ch]).slice(0,3);if(!ops.includes(c))ops[0]=c;
  cQs.push({t:'oS',ans:c,ops:shuf([...new Set(ops)])});});
}
cQs=shuf(cQs).slice(0,10);cTo=cQs.length;}

function genZsQ(lv){
cQs=[];const ch=lv.ch,em=lv.em||{};
for(let i=0;i<Math.min(5,ch.length);i++){const c=ch[i],co=em[c]||'📌';
const ops=[co];while(ops.length<4){const rc=ch[Math.floor(Math.random()*ch.length)],re=em[rc]||'📌';if(!ops.includes(re))ops.push(re);}
cQs.push({t:'c2e',c:c,ans:co,ops:shuf(ops)});}
const ks=Object.keys(WP).filter(k=>ch.includes(k));ks.slice(0,3).forEach(k=>{

// ===== V7 TONE VISUALIZATION SVG =====
function toneSVG(toneIdx,size){
  size=size||40;const h=size*0.75;
  const paths=[
    `M5,${h*0.5} L${size-5},${h*0.5}`, // 1st tone: flat
    `M5,${h*0.7} Q${size*0.5},${h*0.1} ${size-5},${h*0.3}`, // 2nd tone: rising
    `M5,${h*0.5} Q${size*0.3},${h*0.9} ${size*0.5},${h*0.5} Q${size*0.7},${h*0.1} ${size-5},${h*0.7}`, // 3rd tone: dipping
    `M5,${h*0.2} L${size-5},${h*0.8}` // 4th tone: falling
  ];
  const colors=['#6C63FF','#FF6B8A','#FFB347','#4CAF50'];
  return `<svg width="${size}" height="${h}" viewBox="0 0 ${size} ${h}">
    <path d="${paths[toneIdx]}" stroke="${colors[toneIdx]}" stroke-width="3" fill="none" stroke-linecap="round"
      stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="0.8s" fill="freeze"/>
    </path></svg>`;
}

// V7: Star fly animation
function starFlyToBar(el){
  const rect=el.getBoundingClientRect();
  const barRect=document.querySelector('.qpf');
  if(!barRect)return;
  const bRect=barRect.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const star=document.createElement('div');
    star.textContent='⭐';
    star.style.cssText=`position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top}px;font-size:16px;z-index:200;pointer-events:none;transition:all 0.6s cubic-bezier(0.68,-0.55,0.27,1.55);transition-delay:${i*0.1}s;opacity:1;`;
    document.body.appendChild(star);
    requestAnimationFrame(()=>{
      star.style.left=bRect.right+'px';
      star.style.top=bRect.top+'px';
      star.style.opacity='0';
      star.style.fontSize='8px';
    });
    setTimeout(()=>star.remove(),1000);
  }
}

// V7: Star explosion effect
function starExplosion(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<6;i++){
    const s=document.createElement('div');
    const angle=i*60*Math.PI/180;
    const dist=40+Math.random()*30;
    s.textContent=['⭐','✨','🌟','💫'][i%4];
    s.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;font-size:14px;z-index:200;pointer-events:none;transition:all 0.5s ease-out;transition-delay:${i*0.05}s;opacity:1;`;
    document.body.appendChild(s);
    requestAnimationFrame(()=>{
      s.style.left=(cx+Math.cos(angle)*dist)+'px';
      s.style.top=(cy+Math.sin(angle)*dist)+'px';
      s.style.opacity='0';
      s.style.transform='scale(2)';
    });
    setTimeout(()=>s.remove(),700);
  }
}

const pct=cTo>0?Math.round(cCo/cTo*100):0;
const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
const xp=stars*10+5;const coins=stars*5;
const k=cMod.id+'_'+cLv.id;
const prevStars=S.sr[k]||0;
S.sr[k]=Math.max(S.sr[k]||0,stars);S.pg[k]=1;S.ts++;
if(cMod.id==='py')S.td.py++;if(cMod.id==='zs')S.td.zs+=cCo;if(cMod.id==='mt')S.td.mt++;if(cMod.id==='en')S.td.en++;if(cMod.id==='st')S.td.st++;
// V7: Challenge bonus
let challengeBonus=0;
if(cMod._challenge){challengeBonus=cMod._challengeReward||0;delete cMod._challenge;delete cMod._challengeReward;}
addXP(xp);addCo(coins+challengeBonus);
if(stars>=3 && prevStars<3){addGardenPlant(cMod.id);}
checkAllDone();
checkBadges();
const a=$('qA');
a.innerHTML=`<div class="rs">
<div class="ri">${stars>=2?'🎉':'💪'}</div>
<h2>${stars>=3?'太厉害了！':stars>=2?'做得很好！':stars>=1?'继续加油！':'再练练吧！'}</h2>
<div class="rst">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
<div class="rm">答对 ${cCo}/${cTo} · 正确率 ${pct}%</div>
<div style="font-size:14px;color:var(--a);margin-bottom:16px">+${xp}XP +${coins}🪙${challengeBonus?' +'+challengeBonus+'🪙(挑战)':''}</div>
${stars>=3?'<div style="font-size:12px;color:var(--ok);margin-bottom:8px">🌱 花园新长出一株植物！</div>':''}
<div class="bg2"><button class="btn bs" onclick="bTL()">返回关卡</button><button class="btn bp" onclick="stLv(cMod,cLv,0)">再玩一次</button></div>
</div>`;
if(stars>=2){
  showFullCelebration(stars);
  sE('celebrate',2000);
}
sv();}

// ===== V7 FULL CELEBRATION (fireworks + rainbow + cat jump) =====
function showFullCelebration(stars){
  showConfetti();
  spawnParticles('star',20);
  // Firework effect
  for(let i=0;i<5;i++){
    setTimeout(()=>spawnFirework(Math.random()*80+10),i*300);
  }
}

function spawnFirework(x){
  const ov=$('particlesO');
  const colors=['#FF6B8A','#6C63FF','#FFB347','#4CAF50','#FF5252','#FFD700'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  // Shoot up
  const shoot=document.createElement('div');
  shoot.style.cssText=`position:absolute;left:${x}%;bottom:0;width:4px;height:4px;background:${color};border-radius:50%;animation:fireworkShoot 0.8s ease-out forwards;pointer-events:none;`;
  ov.appendChild(shoot);
  // Burst after delay
  setTimeout(()=>{
    for(let i=0;i<12;i++){
      const p=document.createElement('div');
      const angle=i*30*Math.PI/180;
      const dist=30+Math.random()*40;
      p.style.cssText=`position:absolute;left:${x}%;top:20%;width:6px;height:6px;background:${color};border-radius:50%;animation:fireworkBurst 0.8s ease-out forwards;transform-origin:center;pointer-events:none;`;
      p.style.setProperty('--bx',Math.cos(angle)*dist+'px');
      p.style.setProperty('--by',Math.sin(angle)*dist+'px');
      // Manual burst animation
      const startX=x;
      p.animate([
        {transform:'translate(0,0) scale(1)',opacity:1},
        {transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0)`,opacity:0}
      ],{duration:800,easing:'ease-out'});
      ov.appendChild(p);
      setTimeout(()=>p.remove(),1000);
    }
  },700);
  setTimeout(()=>shoot.remove(),1000);
}

// ===== PARTICLES & EFFECTS =====
function spawnParticles(type,n){
const ov=$('particlesO');
for(let i=0;i<n;i++){
  const p=document.createElement('div');
  const x=Math.random()*100;
  const y=30+Math.random()*40;
  let emoji='',anim='';
  if(type==='heart'){emoji=['❤️','💕','💖','💗'][Math.floor(Math.random()*4)];anim='heartFloat';}
  else if(type==='star'){emoji=['⭐','✨','🌟','💫'][Math.floor(Math.random()*4)];anim='starBurst';}
  else if(type==='miss'){emoji=['💨','😢'][Math.floor(Math.random()*2)];anim='hf';}
  else if(type==='confetti'){emoji=['🎊','🎉','🎈'][Math.floor(Math.random()*3)];anim='cf';}
  p.style.cssText=`position:absolute;left:${x}%;top:${y}%;font-size:${16+Math.random()*16}px;animation:${anim} ${1+Math.random()}s ${i*0.1}s forwards;pointer-events:none;`;
  p.textContent=emoji;
  ov.appendChild(p);
  setTimeout(()=>p.remove(),2500);
}
}

function showConfetti(){
const colors=['#FF6B8A','#6C63FF','#FFB347','#4CAF50','#FF5252','#9C27B0'];
for(let i=0;i<25;i++){const c=document.createElement('div');
c.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};animation:confettiFall ${1.5+Math.random()}s ${Math.random()*.5}s forwards;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};z-index:150;pointer-events:none;`;
$('particlesO').appendChild(c);setTimeout(()=>c.remove(),3000);}
spawnParticles('confetti',8);
}

function chkSt(sel,ans,el){

// ===== V7 LOGIN REWARD =====
function showLoginReward(){
  const td=new Date().toDateString();
  if(S.lastLoginReward===td)return;
  S.lastLoginReward=td;
  // Calculate reward based on streak
  let reward=5;
  if(S.st>=3)reward=10;
  if(S.st>=7)reward=20;
  if(S.st>=14)reward=30;
  if(S.st>=30)reward=50;
  addCo(reward);
  const ov=$('loginRewardO');
  $('chestEmoji').textContent=S.st>=7?'💎':'🎁';
  $('loginRewardTitle').textContent=S.st>=7?'豪华登录奖励！':'每日登录奖励';

  $('loginRewardStreak').textContent=`连续登录 ${S.st} 天${S.st>=3?' · 奖励加倍！':''}`;
  ov.classList.add('show');
  spawnParticles('star',S.st>=7?20:10);
  if(S.st>=7)showConfetti();
  sv();
}
