<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>拍照转文字 - 瑞丽房东管家</title>
<link rel="icon" type="image/jpeg" href="birthday_icon.jpg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --p: #6366f1; --p-light: #818cf8; --p-dark: #4f46e5;
  --g: #10b981; --o: #f97316; --d: #ef4444;
  --bg: #f1f5f9; --c: #fff; --t: #1e293b; --ts: #64748b; --bd: #e2e8f0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--t); min-height: 100vh;
  padding-bottom: 40px;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--bd);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
}
.topbar a { color: var(--p); text-decoration: none; font-size: 15px; font-weight: 600; }
.topbar h1 { font-size: 17px; font-weight: 700; flex: 1; text-align: center; margin-right: 40px; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.card {
  background: var(--c); border-radius: 12px; padding: 16px;
  margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.upload-zone {
  border: 2px dashed var(--p-light); border-radius: 12px;
  padding: 28px 20px; text-align: center; cursor: pointer;
  background: #fafaff; transition: .2s;
}
.upload-zone:active { background: #f0f0ff; border-color: var(--p); }
.upload-zone .icon { font-size: 36px; margin-bottom: 8px; }
.upload-zone .text { font-size: 14px; color: var(--p); font-weight: 600; }
.upload-zone .hint { font-size: 12px; color: var(--ts); margin-top: 4px; }
.btn {
  padding: 12px 16px; border-radius: 10px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: .2s;
}
.btn-p { background: var(--p); color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,.3); width: 100%; }
.btn-p:active { background: var(--p-dark); }
.btn-p:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn-o { background: var(--o); color: #fff; }
.btn-g { background: var(--g); color: #fff; }
.btn-sm { padding: 8px 14px; font-size: 13px; flex: 1; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.image-list { display: flex; flex-direction: column; gap: 10px; }
.image-item {
  display: flex; align-items: center; gap: 10px;
  background: #f8fafc; border-radius: 10px; padding: 10px;
}
.image-item img {
  width: 52px; height: 52px; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--bd);
}
.image-info { flex: 1; min-width: 0; }
.image-name {
  font-size: 13px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.image-status { font-size: 11px; margin-top: 2px; }
.status-wait { color: var(--ts); }
.status-ok { color: var(--g); }
.status-err { color: var(--d); }
.status-proc { color: var(--p); }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: #fff; cursor: pointer; font-size: 14px; color: var(--d);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.opt-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--bd);
}
.opt-row:last-child { border-bottom: none; }
.opt-label { font-size: 13px; font-weight: 600; }
.opt-hint { font-size: 11px; color: var(--ts); margin-top: 2px; }
.opt-control select {
  padding: 6px 10px; border: 1.5px solid var(--bd); border-radius: 8px;
  font-size: 13px; outline: none; background: #fff;
}
.opt-control select:focus { border-color: var(--p); }
.result-area {
  width: 100%; min-height: 200px; padding: 12px;
  border: 1.5px solid var(--bd); border-radius: 10px;
  font-size: 14px; line-height: 1.7; outline: none;
  font-family: inherit; resize: vertical; background: #fff;
}
.result-area:focus { border-color: var(--p); }
.result-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.result-toolbar span { font-size: 13px; font-weight: 700; }
.result-toolbar button {
  background: none; border: none; color: var(--p);
  font-size: 12px; cursor: pointer; font-weight: 600;
}
.progress-box { display: none; margin-top: 12px; }
.progress-box.show { display: block; }
.progress-track {
  height: 6px; background: var(--bd); border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--p); border-radius: 3px;
  transition: width .3s; width: 0%;
}
.progress-text { font-size: 12px; color: var(--ts); text-align: center; margin-top: 6px; }
.empty { text-align: center; padding: 30px 20px; color: var(--ts); }
.empty .icon { font-size: 40px; margin-bottom: 8px; opacity: .5; }
.privacy-note {
  text-align: center; font-size: 11px; color: var(--ts);
  padding: 12px; line-height: 1.6;
}
.footer {
  text-align: center; padding: 16px; font-size: 12px; color: var(--ts);
}
.footer a { color: var(--ts); text-decoration: none; }
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(30,41,59,.9); color: #fff; padding: 10px 20px;
  border-radius: 10px; font-size: 13px; z-index: 9999;
  opacity: 0; transition: .3s; pointer-events: none; max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <a href="tools.html">‹ 返回</a>
  <h1>📷 拍照转文字</h1>
</div>

<div class="container">
  <!-- 上传区 -->
  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📷</div>
      <div class="text">点击拍照或选择图片</div>
      <div class="hint">支持JPG/PNG，可多选 · 识别中文+英文+数字</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <!-- 图片列表 -->
  <div class="card" id="listCard" style="display:none">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px;">已选图片 <span id="imgCount" style="font-weight:400;color:var(--ts)"></span></div>
    <div class="image-list" id="imageList"></div>
  </div>

  <!-- 识别设置 -->
  <div class="card" id="optCard" style="display:none">
    <div class="opt-row">
      <div>
        <div class="opt-label">识别语言</div>
        <div class="opt-hint">中文+英文识别效果最好</div>
      </div>
      <div class="opt-control">
        <select id="lang">
          <option value="chi_sim+eng" selected>中文+英文</option>
          <option value="chi_sim">仅中文</option>
          <option value="eng">仅英文/数字</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 识别按钮 -->
  <div class="card" id="actionCard" style="display:none">
    <button class="btn btn-p" id="btnRecognize" onclick="startRecognize()">
      <span id="btnIcon">🔍</span>
      <span id="btnText">开始识别文字</span>
    </button>
    <div class="progress-box" id="progressBox">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">准备中...</div>
    </div>
    <div style="font-size:11px;color:var(--ts);text-align:center;margin-top:8px">
      首次使用需下载识别引擎（约10MB），请耐心等待
    </div>
  </div>

  <!-- 识别结果 -->
  <div class="card" id="resultCard" style="display:none">
    <div class="result-toolbar">
      <span>📝 识别结果 <span id="resultCount" style="font-weight:400;color:var(--ts);font-size:12px"></span></span>
      <button onclick="copyResult()">📋 复制</button>
    </div>
    <textarea class="result-area" id="resultText" placeholder="识别结果将显示在这里，可以直接编辑..."></textarea>
    <div class="btn-row">
      <button class="btn btn-g btn-sm" onclick="exportTxt()">📄 导出TXT</button>
      <button class="btn btn-o btn-sm" onclick="exportWord()">📘 导出Word</button>
      <button class="btn btn-p btn-sm" onclick="exportPdf()">📕 导出PDF</button>
    </div>
  </div>

  <div class="privacy-note">
    🔒 所有识别在浏览器本地完成，图片和文字不会上传到任何服务器<br>
    关闭页面后自动清除
  </div>
</div>

<div class="footer">
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">滇ICP备2026014743号</a>
</div>

<div class="toast" id="toast"></div>

<!-- Tesseract.js OCR引擎 (国内CDN) -->
<script src="https://cdn.bootcdn.net/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<!-- jsPDF for PDF export -->
<script src="https://cdn.bootcdn.net/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- docx for Word export (npmmirror国内镜像) -->
<script src="https://registry.npmmirror.com/docx/8.5.0/files/build/index.umd.js"></script>
<!-- FileSaver for download -->
<script src="https://cdn.bootcdn.net/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
// ===== CDN路径配置 =====
// Tesseract.js v5 默认从 jsdelivr 加载 worker/core/lang（国内可访问）
// 不自定义 workerPath/corePath，避免跨域和MIME类型问题
var LANG_PATH = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/';

// ===== 状态 =====
var images = [];
var idCounter = 0;
var recognizing = false;

var uploadZone = document.getElementById('uploadZone');
var fileInput = document.getElementById('fileInput');

// ===== 上传 =====
uploadZone.addEventListener('click', function() {
  if (recognizing) return;
  fileInput.click();
});
fileInput.addEventListener('change', function(e) {
  handleFiles(e.target.files);
  fileInput.value = '';
});

// 拖拽
uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); this.style.background = '#f0f0ff'; });
uploadZone.addEventListener('dragleave', function(e) { this.style.background = '#fafaff'; });
uploadZone.addEventListener('drop', function(e) {
  e.preventDefault(); this.style.background = '#fafaff';
  handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  var imgFiles = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });
  if (imgFiles.length === 0) { showToast('请选择图片文件'); return; }

  imgFiles.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      images.push({
        id: ++idCounter,
        file: file,
        dataUrl: e.target.result,
        name: file.name,
        status: 'wait',
        text: ''
      });
      renderList();
    };
    reader.readAsDataURL(file);
  });
}

// ===== 渲染列表 =====
function renderList() {
  var listCard = document.getElementById('listCard');
  var optCard = document.getElementById('optCard');
  var actionCard = document.getElementById('actionCard');

  if (images.length === 0) {
    listCard.style.display = 'none';
    optCard.style.display = 'none';
    actionCard.style.display = 'none';
    return;
  }
  listCard.style.display = '';
  optCard.style.display = '';
  actionCard.style.display = '';
  document.getElementById('imgCount').textContent = '(' + images.length + '张)';

  var list = document.getElementById('imageList');
  list.innerHTML = '';
  images.forEach(function(img, idx) {
    var item = document.createElement('div');
    item.className = 'image-item';

    var statusClass = 'status-wait', statusText = '等待识别';
    if (img.status === 'ok') { statusClass = 'status-ok'; statusText = '✓ 已识别'; }
    else if (img.status === 'proc') { statusClass = 'status-proc'; statusText = '识别中...'; }
    else if (img.status === 'err') { statusClass = 'status-err'; statusText = '✕ 识别失败'; }

    item.innerHTML =
      '<img src="' + img.dataUrl + '" alt="">' +
      '<div class="image-info">' +
        '<div class="image-name">' + escHtml(img.name) + '</div>' +
        '<div class="image-status ' + statusClass + '">' + statusText + '</div>' +
      '</div>';
    if (!recognizing) {
      item.innerHTML += '<button class="icon-btn" onclick="removeImg(' + idx + ')">✕</button>';
    }
    list.appendChild(item);
  });
}

function removeImg(idx) {
  if (recognizing) return;
  images.splice(idx, 1);
  renderList();
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== OCR识别 =====
async function startRecognize() {
  if (images.length === 0) { showToast('请先添加图片'); return; }
  if (recognizing) return;

  recognizing = true;
  var btn = document.getElementById('btnRecognize');
  btn.disabled = true;
  document.getElementById('btnIcon').innerHTML = '<span class="spinner"></span>';
  document.getElementById('btnText').textContent = '识别中...';
  document.getElementById('progressBox').classList.add('show');
  document.getElementById('resultCard').style.display = 'none';

  var lang = document.getElementById('lang').value;

  try {
    updateProgress(0, '正在加载识别引擎（首次约需10-30秒）...');

    // 超时保护：45秒未加载完成则报错，避免无限卡住
    var createResult;
    var timeoutPromise = new Promise(function(_, reject) {
      setTimeout(function() { reject(new Error('引擎加载超时，请检查网络后重试')); }, 45000);
    });

    var worker;
    try {
      worker = await Promise.race([
        Tesseract.createWorker(lang, 1, {
          langPath: LANG_PATH,
          logger: function(m) {
            if (m.status === 'loading language traineddata') {
              updateProgress(20, '正在下载中文语言包（约10MB，仅首次）...');
            } else if (m.status === 'initializing api') {
              updateProgress(60, '正在初始化识别引擎...');
            } else if (m.status === 'loading tesseract core') {
              updateProgress(10, '正在加载识别核心...');
            }
          }
        }),
        timeoutPromise
      ]);
    } catch(initErr) {
      throw initErr;
    }

    var allText = [];

    for (var i = 0; i < images.length; i++) {
      images[i].status = 'proc';
      renderList();
      updateProgress(
        Math.round(70 + (i / images.length) * 25),
        '正在识别第 ' + (i+1) + '/' + images.length + ' 张...'
      );

      try {
        var ret = await worker.recognize(images[i].dataUrl);
        var text = (ret.data.text || '').trim();
        images[i].text = text;
        images[i].status = 'ok';
        allText.push(text);
      } catch(e) {
        console.error('OCR error for image', i, e);
        images[i].status = 'err';
        images[i].text = '[识别失败]';
        allText.push('[第' + (i+1) + '张识别失败]');
      }
      renderList();
    }

    await worker.terminate();

    updateProgress(95, '正在整理结果...');

    // 合并结果，图片之间用换行分隔
    var fullText = allText.filter(function(t) {
      return t && t !== '[识别失败]';
    }).join('\n\n');

    document.getElementById('resultText').value = fullText;
    document.getElementById('resultCount').textContent = '(' + fullText.length + '字)';
    document.getElementById('resultCard').style.display = '';
    updateProgress(100, '识别完成！');

    setTimeout(function() {
      document.getElementById('progressBox').classList.remove('show');
    }, 1500);

    showToast('识别完成，共' + fullText.length + '字');

  } catch(err) {
    console.error(err);
    showToast('识别失败：' + (err.message || '请检查网络后重试'));
    document.getElementById('progressBox').classList.remove('show');
  } finally {
    recognizing = false;
    btn.disabled = false;
    document.getElementById('btnIcon').textContent = '🔍';
    document.getElementById('btnText').textContent = '重新识别';
    // 恢复删除按钮
    renderList();
  }
}

function updateProgress(pct, text) {
  document.getElementById('progressFill').style.width = pct + '%';
  if (text) document.getElementById('progressText').textContent = text;
}

// ===== 结果操作 =====
function getResultText() {
  return document.getElementById('resultText').value;
}

function copyResult() {
  var text = getResultText();
  if (!text) { showToast('没有可复制的内容'); return; }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('已复制到剪贴板');
    }).catch(function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制'); }
  catch(e) { showToast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

function exportTxt() {
  var text = getResultText();
  if (!text) { showToast('没有可导出的内容'); return; }
  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  saveAs(blob, '识别结果_' + Date.now() + '.txt');
  showToast('TXT已下载');
}

function exportWord() {
  var text = getResultText();
  if (!text) { showToast('没有可导出的内容'); return; }

  try {
    var docx = window.docx;
    var paragraphs = text.split('\n').map(function(line) {
      return new docx.Paragraph({
        children: [new docx.TextRun({ text: line, size: 24, font: 'Microsoft YaHei' })],
        spacing: { after: 120 }
      });
    });

    var doc = new docx.Document({
      sections: [{
        properties: {
          page: { margin: { top: 720, bottom: 720, left: 720, right: 720 } }
        },
        children: paragraphs
      }]
    });

    docx.Packer.toBlob(doc).then(function(blob) {
      saveAs(blob, '识别结果_' + Date.now() + '.docx');
      showToast('Word已下载');
    });
  } catch(err) {
    console.error(err);
    showToast('Word导出失败：' + err.message);
  }
}

function exportPdf() {
  var text = getResultText();
  if (!text) { showToast('没有可导出的内容'); return; }

  try {
    var { jsPDF } = window.jspdf;
    var doc = new jsPDF({ unit: 'pt', format: 'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 50;
    var maxW = pageW - margin * 2;
    var lineHeight = 18;
    var startY = margin;
    var y = startY;

    // 按行拆分，自动换行
    var lines = doc.splitTextToSize(text, maxW);

    for (var i = 0; i < lines.length; i++) {
      if (y > pageH - margin) {
        doc.addPage();
        y = startY;
      }
      doc.text(lines[i], margin, y);
      y += lineHeight;
    }

    doc.save('识别结果_' + Date.now() + '.pdf');
    showToast('PDF已下载');
  } catch(err) {
    console.error(err);
    showToast('PDF导出失败：' + err.message);
  }
}

// ===== Toast =====
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
