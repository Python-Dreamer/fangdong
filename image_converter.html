<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
<title>拍照扫描 - 瑞丽房东管家</title>
<link rel="icon" type="image/jpeg" href="birthday_icon.jpg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --p: #6366f1; --p-light: #818cf8; --p-dark: #4f46e5;
  --g: #10b981; --o: #f97316; --d: #ef4444;
  --bg: #f1f5f9; --c: #fff; --t: #1e293b; --ts: #64748b; --bd: #e2e8f0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: #0f172a; color: var(--t); min-height: 100vh;
  padding-bottom: 80px;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #1e293b; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.topbar a { color: #94a3b8; text-decoration: none; font-size: 15px; font-weight: 600; }
.topbar h1 { font-size: 17px; font-weight: 700; color: #f1f5f9; flex: 1; text-align: center; margin-right: 40px; }
.container { max-width: 600px; margin: 0 auto; padding: 12px; }

/* 拍照按钮 */
.capture-bar {
  display: flex; gap: 10px; margin-bottom: 12px;
}
.cap-btn {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: .15s;
}
.cap-btn:active { transform: scale(.97); }
.cap-camera { background: var(--p); color: #fff; }
.cap-album { background: #334155; color: #e2e8f0; }

/* 图片列表 */
.page-list { display: flex; flex-direction: column; gap: 10px; }
.page-card {
  background: #1e293b; border-radius: 12px; overflow: hidden;
}
.page-preview {
  width: 100%; background: #0f172a; display: flex; justify-content: center;
  min-height: 200px; position: relative;
}
.page-preview canvas, .page-preview img {
  max-width: 100%; max-height: 400px; object-fit: contain;
}
.page-toolbar {
  display: flex; align-items: center; padding: 8px 12px; gap: 6px;
  background: #1e293b;
}
.page-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--p); color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.page-name {
  flex: 1; font-size: 12px; color: #94a3b8;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.filter-group { display: flex; gap: 4px; }
.fbtn {
  padding: 5px 10px; border-radius: 6px; border: none;
  font-size: 11px; font-weight: 600; cursor: pointer;
  background: #334155; color: #94a3b8; transition: .15s;
}
.fbtn.active { background: var(--p); color: #fff; }
.del-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: rgba(239,68,68,.15); color: var(--d); font-size: 14px;
  cursor: pointer; flex-shrink: 0;
}
.del-btn:active { background: rgba(239,68,68,.3); }
.move-btn {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: #334155; color: #94a3b8; font-size: 14px;
  cursor: pointer; flex-shrink: 0;
}
.ocr-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: rgba(16,185,129,.15); color: var(--g); margin-left: 4px;
}

/* 空状态 */
.empty {
  text-align: center; padding: 60px 20px; color: #475569;
}
.empty .icon { font-size: 56px; margin-bottom: 12px; opacity: .4; }
.empty p { font-size: 14px; line-height: 1.8; }

/* 底部操作栏 */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: #1e293b; border-top: 1px solid #334155;
  padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 10px;
}
.bbtn {
  flex: 1; padding: 13px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: .15s;
}
.bbtn:active { transform: scale(.97); }
.bbtn:disabled { opacity: .4; cursor: not-allowed; }
.bbtn-pdf { background: var(--d); color: #fff; }
.bbtn-ocr { background: var(--g); color: #fff; }
.bbtn-word { background: var(--o); color: #fff; }

/* 进度 */
.progress-mask {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7); z-index: 999;
  align-items: center; justify-content: center;
}
.progress-mask.show { display: flex; }
.progress-box {
  background: #1e293b; border-radius: 16px; padding: 28px 32px;
  text-align: center; min-width: 240px;
}
.progress-spinner {
  width: 36px; height: 36px; border: 3px solid #334155;
  border-top-color: var(--p); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-msg { color: #e2e8f0; font-size: 14px; font-weight: 600; }
.progress-sub { color: #64748b; font-size: 12px; margin-top: 6px; }

/* OCR结果弹窗 */
.ocr-modal {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.6); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.ocr-modal.show { display: flex; }
.ocr-sheet {
  background: #fff; border-radius: 16px 16px 0 0; width: 100%;
  max-width: 600px; max-height: 80vh; display: flex; flex-direction: column;
}
.ocr-header {
  padding: 14px 16px; border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; justify-content: space-between;
}
.ocr-header h3 { font-size: 16px; }
.ocr-close {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: var(--bd); font-size: 16px; cursor: pointer;
}
.ocr-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.ocr-body textarea {
  width: 100%; min-height: 300px; border: 1.5px solid var(--bd);
  border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.8;
  outline: none; font-family: inherit; resize: vertical;
}
.ocr-body textarea:focus { border-color: var(--p); }
.ocr-footer {
  padding: 10px 16px; border-top: 1px solid var(--bd);
  display: flex; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
}
.ocr-footer button {
  flex: 1; padding: 11px; border-radius: 9px; border: none;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.of-copy { background: var(--p); color: #fff; }
.of-word { background: var(--o); color: #fff; }
.of-txt { background: var(--g); color: #fff; }

.privacy-note {
  text-align: center; font-size: 11px; color: #475569;
  padding: 16px; line-height: 1.7;
}
.footer {
  text-align: center; padding: 12px; font-size: 11px; color: #334155;
}
.footer a { color: #475569; text-decoration: none; }
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(30,41,59,.95); color: #fff; padding: 10px 20px;
  border-radius: 10px; font-size: 13px; z-index: 9999;
  opacity: 0; transition: .3s; pointer-events: none; max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <a href="tools.html">‹ 返回</a>
  <h1>📷 拍照扫描</h1>
</div>

<div class="container">
  <div class="capture-bar">
    <button class="cap-btn cap-camera" onclick="capturePhoto()">📸 拍照扫描</button>
    <button class="cap-btn cap-album" onclick="pickAlbum()">🖼️ 从相册选</button>
  </div>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="albumInput" accept="image/*" multiple style="display:none">

  <div id="pageList" class="page-list"></div>

  <div id="emptyState" class="empty">
    <div class="icon">📄</div>
    <p>拍照或选择图片开始扫描<br>支持多页文档 · 自动增强 · 生成PDF<br>识别文字可复制导出</p>
  </div>

  <div class="privacy-note">
    🔒 图片处理在浏览器完成，PDF直接下载到你的设备<br>
    文字识别由百度AI提供，服务器不留存图片
  </div>
</div>

<div class="footer">
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">滇ICP备2026014743号</a>
</div>

<div class="bottom-bar" id="bottomBar" style="display:none">
  <button class="bbtn bbtn-pdf" onclick="exportPDF()">📕 PDF</button>
  <button class="bbtn bbtn-ocr" onclick="runOCR()">🔍 识别</button>
  <button class="bbtn bbtn-word" onclick="exportWordFromOCR()">📝 可编辑</button>
  <button class="bbtn" onclick="exportExcelFromOCR()" style="background:#16a34a;color:#fff">📊 表格</button>
  <button class="bbtn" onclick="exportWordImage()" style="background:#3b82f6;color:#fff">📷 原图</button>
</div>

<div class="progress-mask" id="progressMask">
  <div class="progress-box">
    <div class="progress-spinner"></div>
    <div class="progress-msg" id="progMsg">处理中...</div>
    <div class="progress-sub" id="progSub"></div>
  </div>
</div>

<div class="ocr-modal" id="ocrModal">
  <div class="ocr-sheet">
    <div class="ocr-header">
      <h3>📝 识别结果</h3>
      <button class="ocr-close" onclick="closeOCR()">✕</button>
    </div>
    <div class="ocr-body">
      <textarea id="ocrText" placeholder="识别结果..."></textarea>
    </div>
    <div class="ocr-footer">
      <button class="of-copy" onclick="copyOCR()">📋 复制</button>
      <button class="of-txt" onclick="exportOCRtxt()">📄 TXT</button>
      <button class="of-word" onclick="exportOCRword()">📝 可编辑Word</button>
      <button class="of-word" onclick="exportExcelFromOCR()" style="background:#16a34a">📊 Excel表格</button>
      <button class="of-word" onclick="exportOCRwordImage()" style="background:#3b82f6">📷 原图Word</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.bootcdn.net/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://registry.npmmirror.com/docx/8.5.0/files/build/index.umd.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ===== 状态 =====
var pages = []; // {id, imgEl, canvas, filter, name}
var pid = 0;
var ocrResultText = '';
var ocrResults = []; // 每页的结构化OCR结果 [{text, lines, paragraphs, image_width, image_height}]

document.getElementById('cameraInput').addEventListener('change', function(e) {
  handleFiles(e.target.files); e.target.value = '';
});
document.getElementById('albumInput').addEventListener('change', function(e) {
  handleFiles(e.target.files); e.target.value = '';
});

function capturePhoto() { document.getElementById('cameraInput').click(); }
function pickAlbum() { document.getElementById('albumInput').click(); }

function handleFiles(files) {
  var imgs = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });
  if (!imgs.length) return;
  imgs.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        pages.push({
          id: ++pid,
          imgEl: img,
          canvas: null,
          filter: 'enhance',
          name: file.name || ('扫描_' + pid + '.jpg')
        });
        processPage(pages[pages.length - 1]);
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===== 图片处理 =====
function processPage(page) {
  var img = page.imgEl;
  var w = img.width, h = img.height;
  // 限制最大尺寸2000px
  var maxDim = 2000;
  if (Math.max(w, h) > maxDim) {
    var s = maxDim / Math.max(w, h);
    w = Math.round(w * s); h = Math.round(h * s);
  }
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  page.canvas = applyFilter(ctx, w, h, page.filter);
}

function applyFilter(ctx, w, h, filter) {
  var src = ctx.getImageData(0, 0, w, h);
  var d = src.data;

  if (filter === 'original') {
    ctx.putImageData(src, 0, 0);
    return ctx.canvas;
  }

  if (filter === 'bw') {
    // 黑白文档模式：灰度→自适应阈值
    var gray = new Uint8ClampedArray(w * h);
    for (var i = 0; i < d.length; i += 4) {
      gray[i/4] = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
    }
    // 积分图快速自适应阈值
    var integral = new Float64Array((w+1) * (h+1));
    for (var y = 0; y < h; y++) {
      var sum = 0;
      for (var x = 0; x < w; x++) {
        sum += gray[y*w + x];
        integral[(y+1)*(w+1) + (x+1)] = integral[y*(w+1) + (x+1)] + sum;
      }
    }
    var win = Math.round(Math.min(w, h) * 0.08);
    if (win < 8) win = 8;
    for (var y2 = 0; y2 < h; y2++) {
      for (var x2 = 0; x2 < w; x2++) {
        var x1 = Math.max(0, x2 - win), x2e = Math.min(w-1, x2 + win);
        var y1 = Math.max(0, y2 - win), y2e = Math.min(h-1, y2 + win);
        var count = (x2e - x1 + 1) * (y2e - y1 + 1);
        var sum2 = integral[(y2e+1)*(w+1)+(x2e+1)] - integral[y1*(w+1)+(x2e+1)]
                 - integral[(y2e+1)*(w+1)+(x1+1)] + integral[y1*(w+1)+(x1+1)];
        var avg = sum2 / count;
        var val = gray[y2*w + x2] < avg - 12 ? 0 : 255;
        var idx2 = (y2*w + x2) * 4;
        d[idx2] = d[idx2+1] = d[idx2+2] = val;
      }
    }
    ctx.putImageData(src, 0, 0);
    return ctx.canvas;
  }

  // enhance模式：去阴影+对比度增强
  var gray2 = new Float32Array(w * h);
  for (var i2 = 0; i2 < d.length; i2 += 4) {
    gray2[i2/4] = 0.299*d[i2] + 0.587*d[i2+1] + 0.114*d[i2+2];
  }
  // 背景估计
  var bgC = document.createElement('canvas');
  bgC.width = w; bgC.height = h;
  var bgCtx = bgC.getContext('2d');
  bgCtx.filter = 'blur(24px)';
  bgCtx.drawImage(ctx.canvas, 0, 0, w, h);
  var bgD = bgCtx.getImageData(0, 0, w, h).data;

  var mn = 255, mx = 0;
  var norm = new Float32Array(w * h);
  for (var j = 0; j < w * h; j++) {
    var bg = 0.299*bgD[j*4] + 0.587*bgD[j*4+1] + 0.114*bgD[j*4+2];
    if (bg < 1) bg = 1;
    var v = (gray2[j] / bg) * 205;
    if (v > 255) v = 255; if (v < 0) v = 0;
    norm[j] = v;
    if (v < mn) mn = v; if (v > mx) mx = v;
  }
  var range = mx - mn; if (range < 1) range = 1;
  for (var k = 0; k < w * h; k++) {
    var out = Math.round(((norm[k] - mn) / range) * 255);
    var ki = k * 4;
    d[ki] = d[ki+1] = d[ki+2] = out;
  }
  ctx.putImageData(src, 0, 0);
  return ctx.canvas;
}

// ===== 渲染 =====
function render() {
  var list = document.getElementById('pageList');
  var empty = document.getElementById('emptyState');
  var bar = document.getElementById('bottomBar');

  if (!pages.length) {
    list.innerHTML = '';
    empty.style.display = '';
    bar.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  bar.style.display = 'flex';

  list.innerHTML = '';
  pages.forEach(function(p, idx) {
    var card = document.createElement('div');
    card.className = 'page-card';
    card.innerHTML =
      '<div class="page-preview"><canvas id="cv' + p.id + '"></canvas></div>' +
      '<div class="page-toolbar">' +
        '<div class="page-num">' + (idx+1) + '</div>' +
        '<div class="page-name">' + escHtml(p.name) + '</div>' +
        '<div class="filter-group">' +
          '<button class="fbtn ' + (p.filter==='original'?'active':'') + '" onclick="setFilter(' + idx + ",\'original\')" + '">原图</button>' +
          '<button class="fbtn ' + (p.filter==='enhance'?'active':'') + '" onclick="setFilter(' + idx + ",\'enhance\')" + '">增强</button>' +
          '<button class="fbtn ' + (p.filter==='bw'?'active':'') + '" onclick="setFilter(' + idx + ",\'bw\')" + '">黑白</button>' +
        '</div>' +
        (idx > 0 ? '<button class="move-btn" onclick="movePage(' + idx + ',-1)">↑</button>' : '') +
        (idx < pages.length-1 ? '<button class="move-btn" onclick="movePage(' + idx + ',1)">↓</button>' : '') +
        '<button class="del-btn" onclick="delPage(' + idx + ')">✕</button>' +
      '</div>';
    list.appendChild(card);
    // 画canvas
    var cv = document.getElementById('cv' + p.id);
    if (p.canvas && cv) {
      cv.width = p.canvas.width;
      cv.height = p.canvas.height;
      cv.getContext('2d').drawImage(p.canvas, 0, 0);
    }
  });
}

function setFilter(idx, f) {
  pages[idx].filter = f;
  processPage(pages[idx]);
  render();
}

function movePage(idx, dir) {
  var ni = idx + dir;
  if (ni < 0 || ni >= pages.length) return;
  var t = pages[idx]; pages[idx] = pages[ni]; pages[ni] = t;
  render();
}

function delPage(idx) {
  pages.splice(idx, 1);
  render();
}

function escHtml(s) {
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ===== 进度 =====
function showProg(msg, sub) {
  document.getElementById('progMsg').textContent = msg;
  document.getElementById('progSub').textContent = sub || '';
  document.getElementById('progressMask').classList.add('show');
}
function hideProg() {
  document.getElementById('progressMask').classList.remove('show');
}

// ===== 生成PDF（图片模式，原版式100%保留） =====
function exportPDF() {
  if (!pages.length) return;
  showProg('正在生成PDF...', pages.length + '页');
  setTimeout(function() {
    try {
      var { jsPDF } = window.jspdf;
      var pdf = null;
      for (var i = 0; i < pages.length; i++) {
        var cv = pages[i].canvas;
        var w = cv.width, h = cv.height;
        // A4比例适配
        var pdfW = 595.28, pdfH = 841.89;
        var ratio = Math.min(pdfW / w, pdfH / h);
        var rw = w * ratio, rh = h * ratio;
        var x = (pdfW - rw) / 2, y = (pdfH - rh) / 2;
        var imgData = cv.toDataURL('image/jpeg', 0.88);
        if (!pdf) {
          pdf = new jsPDF({ unit: 'pt', format: 'a4' });
        } else {
          pdf.addPage();
        }
        pdf.addImage(imgData, 'JPEG', x, y, rw, rh);
      }
      pdf.save('扫描件_' + Date.now() + '.pdf');
      hideProg();
      showToast('PDF已生成，共' + pages.length + '页');
    } catch(e) {
      hideProg();
      showToast('生成失败：' + e.message);
    }
  }, 100);
}

// ===== 图片压缩（百度API限制4MB base64） =====
function compressForAPI(canvas) {
  var maxDim = 2000;
  var w = canvas.width, h = canvas.height;
  var c = canvas;
  if (Math.max(w, h) > maxDim) {
    var s = maxDim / Math.max(w, h);
    var nc = document.createElement('canvas');
    nc.width = Math.round(w*s); nc.height = Math.round(h*s);
    nc.getContext('2d').drawImage(canvas, 0, 0, nc.width, nc.height);
    c = nc;
  }
  var q = 0.9;
  var data = c.toDataURL('image/jpeg', q);
  while (data.length * 0.75 > 3500000 && q > 0.3) {
    q -= 0.1;
    data = c.toDataURL('image/jpeg', q);
  }
  return data;
}

// ===== OCR文字识别 =====
async function runOCR() {
  if (!pages.length) return;
  showProg('正在识别文字...', '0/' + pages.length);
  ocrResultText = '';
  ocrResults = [];
  var all = [];

  try {
    for (var i = 0; i < pages.length; i++) {
      document.getElementById('progSub').textContent = (i+1) + '/' + pages.length;
      var imgData = compressForAPI(pages[i].canvas);

      try {
        var resp = await fetch('/api/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imgData, accurate: true })
        });
        var data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '识别失败');
        ocrResults.push(data);
        if (data.text) all.push(data.text);
      } catch(e) {
        console.warn('第' + (i+1) + '页识别失败:', e);
        ocrResults.push(null);
        all.push('[第' + (i+1) + '页识别失败]');
      }
    }

    ocrResultText = all.join('\n\n———————\n\n');
    document.getElementById('ocrText').value = ocrResultText;
    hideProg();
    document.getElementById('ocrModal').classList.add('show');
  } catch(e) {
    hideProg();
    showToast('识别失败：' + e.message);
  }
}

function closeOCR() {
  document.getElementById('ocrModal').classList.remove('show');
}

function copyOCR() {
  var t = document.getElementById('ocrText').value;
  if (!t) { showToast('没有内容'); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(function() { showToast('已复制'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制');
  }
}

function exportOCRtxt() {
  var t = document.getElementById('ocrText').value;
  if (!t) { showToast('没有内容'); return; }
  saveAs(new Blob([t], { type: 'text/plain;charset=utf-8' }), '识别结果_' + Date.now() + '.txt');
  showToast('TXT已下载');
}

// ===== 版面分析引擎 v4：单元格合并+智能多列检测 =====
// ocrData: {text, lines, paragraphs, image_width, image_height, _canvasW, _canvasH}
function analyzeLayout(ocrData) {
  if (!ocrData || !ocrData.lines || !ocrData.lines.length) return [];
  // 过滤空行/纯空格行（OCR有时识别出无意义空片段）
  var lines = ocrData.lines.filter(function(l) {
    return l.text && l.text.replace(/\s+/g,'').length > 0;
  });
  if (!lines.length) return [];

  // 使用canvas真实尺寸（优先），其次用OCR估算
  var imgW = ocrData._canvasW || ocrData.image_width || 1000;
  var imgH = ocrData._canvasH || ocrData.image_height || 1000;

  // 计算正文字高中位数
  var heights = lines.map(function(l){return l.height;}).filter(function(h){return h>5;}).sort(function(a,b){return a-b;});
  var medianH = heights[Math.floor(heights.length/2)] || 28;
  if (medianH < 10) medianH = 28;

  // DPI换算：基于所有文字行的实际左右边界计算内容区域
  var allLefts = lines.map(function(l){return l.left;});
  var allRights = lines.map(function(l){return l.left + l.width;});
  var contentLeft = Math.min.apply(null, allLefts);
  var contentRight = Math.max.apply(null, allRights);
  var contentAreaW = contentRight - contentLeft;
  if (contentAreaW < imgW * 0.3) contentAreaW = imgW * 0.7; // 兜底
  // A4可用宽度9026twips，SCALE = 9026 / 内容区像素宽
  var SCALE = 9026 / contentAreaW;

  // 按top排序，同top按left排序
  lines.sort(function(a, b) {
    if (Math.abs(a.top - b.top) > Math.max(a.height, b.height) * 0.5) return a.top - b.top;
    return a.left - b.left;
  });

  // ========== 第一步：将OCR行组合为"视觉行"（同排合并）==========
  var visualRows = [];
  var used = {};
  for (var i = 0; i < lines.length; i++) {
    if (used[i]) continue;
    var row = { segments: [lines[i]], top: lines[i].top, bottom: lines[i].top + lines[i].height };
    used[i] = true;
    var cy1 = lines[i].top + lines[i].height / 2;
    for (var j = i + 1; j < lines.length; j++) {
      if (used[j]) continue;
      var cy2 = lines[j].top + lines[j].height / 2;
      var vOverlap = Math.abs(cy1 - cy2) < medianH * 0.7 &&
                     Math.abs(lines[j].top - lines[i].top) < medianH * 0.9;
      if (vOverlap) {
        row.segments.push(lines[j]);
        used[j] = true;
        row.top = Math.min(row.top, lines[j].top);
        row.bottom = Math.max(row.bottom, lines[j].top + lines[j].height);
      }
    }
    row.segments.sort(function(a,b){return a.left - b.left;});

    // ★ 关键修复：将间距小的相邻segments合并为"单元格"
    // OCR常把"出租人（甲方）："和"熊永燕"拆成两个片段，但它们属于同一列
    // 间距 < medianH*1.8 的合并为同一单元格，间距大的才是列与列之间的分界
    var cells = [];
    for (var si = 0; si < row.segments.length; si++) {
      var seg = row.segments[si];
      if (cells.length === 0) {
        cells.push({ text: seg.text, left: seg.left, top: seg.top,
                     right: seg.left + seg.width, bottom: seg.top + seg.height,
                     height: seg.height, width: seg.width });
      } else {
        var lastCell = cells[cells.length - 1];
        var cellGap = seg.left - lastCell.right;
        if (cellGap < medianH * 1.8) {
          // 间距小，合并到当前单元格
          lastCell.text += seg.text;
          lastCell.right = Math.max(lastCell.right, seg.left + seg.width);
          lastCell.bottom = Math.max(lastCell.bottom, seg.top + seg.height);
          lastCell.top = Math.min(lastCell.top, seg.top);
          lastCell.width = lastCell.right - lastCell.left;
          lastCell.height = Math.max(lastCell.height, seg.height);
        } else {
          // 间距大，新建单元格（新的一列）
          cells.push({ text: seg.text, left: seg.left, top: seg.top,
                       right: seg.left + seg.width, bottom: seg.top + seg.height,
                       height: seg.height, width: seg.width });
        }
      }
    }
    row.cells = cells;
    row.left = cells[0].left;
    row.right = cells[cells.length - 1].right;
    row.avgH = row.segments.reduce(function(s,l){return s+l.height;},0) / row.segments.length;
    row.text = cells.map(function(c){return c.text;}).join('  ');
    visualRows.push(row);
  }
  visualRows.sort(function(a,b){return a.top - b.top;});

  // ========== 第二步：基于单元格判断多列行 ==========
  function isMultiColumn(row) {
    if (!row.cells || row.cells.length < 2) return false;
    // 多列行是表单/标签行：总文本短，每个cell短，且跨整个内容宽度
    var totalText = row.cells.map(function(c){return c.text;}).join('');
    var totalLen = totalText.replace(/\s+/g,'').length;
    if (totalLen > 80) return false;
    // 每个单元格都较短（标签+值≤30字，如身份证号18位）
    var allCellShort = row.cells.every(function(c) {
      return c.text.replace(/\s+/g,'').length <= 30;
    });
    if (!allCellShort) return false;
    // 单元格间距大（> medianH*2.0），确认是列分隔
    for (var k = 0; k < row.cells.length - 1; k++) {
      var gap = row.cells[k+1].left - row.cells[k].right;
      if (gap < medianH * 2.0) return false;
    }
    // 整行宽度至少占内容区域的40%
    var rowWidth = row.cells[row.cells.length-1].right - row.cells[0].left;
    if (rowWidth < contentAreaW * 0.4) return false;
    // ★ 关键：表单行至少有一个cell含冒号（标签：值模式），正文两端对齐换行没有冒号
    var hasColon = row.cells.some(function(c) {
      return /[：:]/.test(c.text);
    });
    if (!hasColon) return false;
    return true;
  }

  // ========== 第三步：将视觉行组合为段落 ==========
  // 连续的单列行，如果垂直间距接近行高，合并为一个段落
  var elements = [];
  var paraBuf = []; // 缓冲的单列正文行

  function flushPara() {
    if (!paraBuf.length) return;
    var first = paraBuf[0];
    var last = paraBuf[paraBuf.length - 1];
    var allText = paraBuf.map(function(r){return r.text;}).join('');
    var left = first.left;
    var top = first.top;
    var h = first.avgH;
    var ratio = h / medianH;

    // 判断是否是标题
    var centerX = first.left + (last.right - first.left) / 2;
    // 用所有段落行的中心来判断
    var centers = paraBuf.map(function(r){return (r.left+r.right)/2;});
    var avgCenter = centers.reduce(function(a,b){return a+b;},0) / centers.length;
    var isCentered = Math.abs(avgCenter - imgW/2) < imgW * 0.12;
    var isTop = top < imgH * 0.12;
    var isShort = allText.replace(/\s+/g,'').length <= 25;
    var isTitlePat = /(合同|协议|责任书|证明|委托书|申请书|清单|报告|通知|守则|制度)$/.test(allText) && allText.length <= 20;

    // 判断是否是条款标题
    var isHeadingPat = /^(第[一二三四五六七八九十百千0-9]+[章节条篇部、.．]|[一二三四五六七八九十]+[、.．])/.test(allText);
    var isSingleShort = paraBuf.length === 1 && isShort;

    var type = 'body';
    if ((isTop && isCentered && (ratio >= 1.2 || isTitlePat) && isShort) ||
        (isTop && isCentered && isTitlePat)) {
      type = 'title';
    } else if (isHeadingPat && allText.length <= 40) {
      // 条款标题：第X条/一、/1. 开头，且不超过40字
      type = 'heading';
    } else if (ratio >= 1.15 && isSingleShort) {
      type = 'heading';
    }

    // 首行缩进：正文段落如果首行left比其他行大，或者是长段落
    var indent = false;
    if (type === 'body') {
      var paraLefts = paraBuf.map(function(r){return r.left;});
      var minLeft = Math.min.apply(null, paraLefts);
      var firstLineIndent = first.left - minLeft;
      // 长段落自动缩进，或首行明显缩进
      indent = allText.length > 30 || firstLineIndent > medianH * 0.8;
    }

    elements.push({
      type: type,
      text: allText,
      segments: paraBuf.length === 1 ? paraBuf[0].segments : null,
      indent: indent,
      height: h,
      ratio: ratio,
      top: top,
      isMulticol: false,
      pixelLeft: left,
      pixelH: h
    });
    paraBuf = [];
  }

  for (var vi = 0; vi < visualRows.length; vi++) {
    var vr = visualRows[vi];
    var multicol = isMultiColumn(vr);

    if (multicol) {
      // 先冲刷缓冲的段落
      flushPara();
      var ratio = vr.avgH / medianH;
      // 多列行（表单字段等），使用合并后的cells
      var isHeading = /^(第[一二三四五六七八九十百千0-9]+[章节条篇部、.．]|[一二三四五六七八九十]+[、.．])/.test(vr.text);
      elements.push({
        type: isHeading ? 'heading' : 'multicol',
        text: vr.text,
        cells: vr.cells,
        segments: vr.segments,
        indent: false,
        height: vr.avgH,
        ratio: ratio,
        top: vr.top,
        isMulticol: true,
        pixelLeft: vr.left,
        pixelH: vr.avgH
      });
    } else {
      // 单列行（可能是两端对齐被拆成多segment/cell，需要拆开）
      if (vr.cells.length > 1) {
        // 把多cell拆成独立的虚拟行，按顺序加入段落缓冲
        for (var si = 0; si < vr.cells.length; si++) {
          var cell = vr.cells[si];
          var vrow = {
            segments: [cell], text: cell.text,
            top: cell.top, bottom: cell.bottom,
            left: cell.left, right: cell.right,
            avgH: cell.height || medianH
          };
          if (paraBuf.length > 0) {
            var prev2 = paraBuf[paraBuf.length - 1];
            var gap2 = vrow.top - prev2.bottom;
            var sameP = gap2 < (prev2.avgH || medianH) * 1.1;
            var prevH2 = /^(第[一二三四五六七八九十百千0-9]+[章节条篇部、.．])/.test(prev2.text);
            if (prevH2) sameP = false;
            if (!sameP) flushPara();
          }
          paraBuf.push(vrow);
        }
        continue;
      }
      // 真正的单列行
      var headPattern = /^(第[一二三四五六七八九十百千0-9]+[章节条篇部、.．]|[一二三四五六七八九十]+[、.．])/;
      var curIsHead = headPattern.test(vr.text) && vr.text.length <= 40;

      // 条款标题直接输出，不进入段落缓冲
      if (curIsHead) {
        flushPara();
        elements.push({
          type: 'heading',
          text: vr.text,
          segments: vr.segments,
          indent: false,
          height: vr.avgH,
          ratio: vr.avgH / medianH,
          top: vr.top,
          isMulticol: false,
          pixelLeft: vr.left,
          pixelH: vr.avgH
        });
        continue;
      }

      if (paraBuf.length > 0) {
        var prev = paraBuf[paraBuf.length - 1];
        var gap = vr.top - prev.bottom;
        var lineH = prev.avgH || medianH;
        var samePara = gap < lineH * 1.1;

        var prevIsHead = headPattern.test(prev.text);
        if (prevIsHead) samePara = false;

        if (!samePara) flushPara();
      }
      paraBuf.push(vr);
    }
  }
  flushPara();

  // 附加SCALE供Word构建使用
  elements._SCALE = SCALE;
  elements._imgW = imgW;
  elements._contentLeft = contentLeft;
  return elements;
}

// ===== 像素高度转Word半磅（half-points）=====
function pixelToHalfPoints(pixelH, imgH) {
  // A4纸高16838twips=11.69inch，图片按A4拍摄DPI≈170
  // 1px = 1/170 inch, 1pt = 1/72 inch, 所以 1px = 72/170 ≈ 0.424pt
  var pt = pixelH * 0.42;
  if (pt < 9) pt = 9;
  if (pt > 26) pt = 26;
  return Math.round(pt * 2);
}

// ===== 构建docx段落 =====
function buildDocxParasFromLayout(allPagesData, docx) {
  var children = [];
  var TabStopType = docx.TabStopType || { LEFT: 'left' };
  // A4可用宽度约9026 twips
  var PAGE_CONTENT_W = 9026;

  for (var pi = 0; pi < allPagesData.length; pi++) {
    var pageData = allPagesData[pi];
    if (!pageData || !pageData.elements || !pageData.elements.length) continue;

    if (pi > 0 && children.length) {
      children.push(new docx.Paragraph({ children: [new docx.PageBreak()] }));
    }

    var SCALE = pageData.SCALE || (9026 / (pageData.imgW * 0.7));
    // 内容左边界，用于计算相对位置
    var contentLeftPx = pageData.contentLeft || 0;
    var elements = pageData.elements;

    for (var i = 0; i < elements.length; i++) {
      var el = elements[i];
      var opts = { children: [] };
      var CN_FONT = 'SimSun'; // 宋体，更接近合同文档

      if (el.type === 'title') {
        var sz = pixelToHalfPoints(el.height, pageData.imgH);
        if (sz < 28) sz = 28; // 标题至少14pt
        opts.alignment = docx.AlignmentType.CENTER;
        opts.spacing = { before: 0, after: 240, line: 300, lineRule: 'auto' };
        opts.children = [new docx.TextRun({
          text: el.text, font: CN_FONT, size: sz, bold: true
        })];
      } else if (el.type === 'heading') {
        var hsz = pixelToHalfPoints(el.height, pageData.imgH);
        if (hsz < 24) hsz = 24; // 条款标题至少12pt
        opts.spacing = { before: 180, after: 80, line: 280, lineRule: 'auto' };
        opts.children = [new docx.TextRun({
          text: el.text, font: CN_FONT, size: hsz, bold: true
        })];
      } else if (el.isMulticol && el.cells && el.cells.length >= 2) {
        // 多列行：用制表位对齐，使用合并后的cells
        opts.spacing = { after: 20, line: 280, lineRule: 'auto' };
        var runs = [];
        var tabPositions = [];
        // 第一个cell的left作为基准
        var baseLeft = el.cells[0].left;
        for (var s = 0; s < el.cells.length; s++) {
          if (s > 0) {
            runs.push(new docx.TextRun({ text: '\t', font: CN_FONT, size: 22 }));
            // tab位置 = (该cell的left - 第一个cell的left) * SCALE
            var tabPos = Math.round((el.cells[s].left - baseLeft) * SCALE);
            if (tabPos < 0) tabPos = 0;
            if (tabPos > PAGE_CONTENT_W) tabPos = PAGE_CONTENT_W;
            tabPositions.push({ type: TabStopType.LEFT, position: tabPos });
          }
          runs.push(new docx.TextRun({
            text: el.cells[s].text, font: CN_FONT, size: 22
          }));
        }
        opts.children = runs;
        if (tabPositions.length) opts.tabStops = tabPositions;
      } else {
        // 正文
        var bsz = pixelToHalfPoints(el.height, pageData.imgH);
        if (bsz < 24) bsz = 24; // 正文至少12pt（小四）
        opts.spacing = { after: 20, line: 300, lineRule: 'auto' };
        // 正文两端对齐
        opts.alignment = docx.AlignmentType.JUSTIFIED;
        if (el.indent) {
          opts.indent = { firstLine: 480 };
        }
        opts.children = [new docx.TextRun({
          text: el.text, font: CN_FONT, size: bsz
        })];
      }
      children.push(new docx.Paragraph(opts));
    }
  }
  return children;
}

// ===== 格式化Word导出（核心） =====
function buildFormattedWord() {
  var docx = window.docx;
  // 每页附带canvas真实尺寸
  var allPagesData = ocrResults.map(function(r, idx) {
    if (!r) return null;
    var page = pages[idx];
    var canvasW = page && page.canvas ? page.canvas.width : (r.image_width || 1000);
    var canvasH = page && page.canvas ? page.canvas.height : (r.image_height || 1000);
    r._canvasW = canvasW;
    r._canvasH = canvasH;
    var elements = analyzeLayout(r);
    var SCALE = elements._SCALE || (9026 / (canvasW * 0.7));
    return {
      elements: elements,
      SCALE: SCALE,
      imgW: canvasW,
      imgH: canvasH,
      contentLeft: elements._contentLeft || 0
    };
  }).filter(Boolean);

  var children = buildDocxParasFromLayout(allPagesData, docx);

  return new docx.Document({
    sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838 },
          margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 }
        }
      },
      children: children
    }]
  });
}

// ===== 运行OCR（如果还没跑过）=====
async function ensureOCR() {
  if (ocrResults.length === pages.length && ocrResults.some(function(r){return r;})) return true;
  showProg('正在识别文字...', '0/' + pages.length);
  ocrResults = [];
  for (var i = 0; i < pages.length; i++) {
    document.getElementById('progSub').textContent = (i+1) + '/' + pages.length;
    var imgData = compressForAPI(pages[i].canvas);
    try {
      var resp = await fetch('/api/ocr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imgData, accurate: true })
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '识别失败');
      // 附带canvas真实尺寸
      data._canvasW = pages[i].canvas.width;
      data._canvasH = pages[i].canvas.height;
      ocrResults.push(data);
    } catch(e) {
      console.warn('第' + (i+1) + '页识别失败:', e);
      ocrResults.push(null);
    }
  }
  return ocrResults.some(function(r){return r;});
}

// ===== 导出Word（OCR弹窗内按钮）=====
function exportOCRword() {
  if (!ocrResults.length) { showToast('请先识别文字'); return; }
  try {
    var doc = buildFormattedWord();
    window.docx.Packer.toBlob(doc).then(function(blob) {
      saveAs(blob, '识别结果_' + Date.now() + '.docx');
      showToast('可编辑Word已下载');
    });
  } catch(e) { showToast('Word导出失败：' + e.message); }
}

// ===== 导出原图Word（弹窗内按钮，不需要OCR）=====
function exportOCRwordImage() {
  if (!pages.length) { showToast('没有图片'); return; }
  try {
    var docx = window.docx;
    var children = buildImageWordChildren(docx);
    var doc = new docx.Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 720, bottom: 720, left: 720, right: 720 }
          }
        },
        children: children
      }]
    });
    docx.Packer.toBlob(doc).then(function(blob) {
      saveAs(blob, '扫描原图_' + Date.now() + '.docx');
      showToast('原图Word已下载');
    });
  } catch(e) { showToast('Word导出失败：' + e.message); }
}

// ===== 构建图片Word的children（每页一张图，原版式100%保留）=====
function buildImageWordChildren(docx) {
  var children = [];
  for (var i = 0; i < pages.length; i++) {
    var cv = pages[i].canvas;
    // A4可用宽度约600px @96dpi
    var maxW = 600;
    var w = cv.width, h = cv.height;
    var scale = w > maxW ? maxW / w : 1;
    var tmp = document.createElement('canvas');
    tmp.width = Math.round(w * scale);
    tmp.height = Math.round(h * scale);
    tmp.getContext('2d').drawImage(cv, 0, 0, tmp.width, tmp.height);
    var b64 = tmp.toDataURL('image/jpeg', 0.9).split(',')[1];

    children.push(new docx.Paragraph({
      children: [new docx.ImageRun({
        data: b64,
        transformation: {
          width: Math.round(tmp.width * 0.75),
          height: Math.round(tmp.height * 0.75)
        }
      })],
      alignment: docx.AlignmentType.CENTER,
      spacing: { after: 0 }
    }));

    if (i < pages.length - 1) {
      children.push(new docx.Paragraph({
        children: [new docx.PageBreak()]
      }));
    }
  }
  return children;
}

// ===== 导出可编辑Word（底部按钮，自动OCR+格式化）=====
async function exportWordFromOCR() {
  if (!pages.length) return;
  try {
    var ok = await ensureOCR();
    if (!ok) { hideProg(); showToast('文字识别失败，请重试'); return; }
    hideProg();
    var doc = buildFormattedWord();
    window.docx.Packer.toBlob(doc).then(function(blob) {
      saveAs(blob, '扫描件_可编辑_' + Date.now() + '.docx');
      showToast('可编辑Word已生成，共' + pages.length + '页');
    });
  } catch(e) {
    hideProg();
    showToast('Word生成失败：' + e.message);
  }
}

// ===== 导出Excel表格 =====
// 策略：利用已有的版面分析结果，把 multicol 多列行识别为表格数据
async function exportExcelFromOCR() {
  if (!pages.length) return;
  try {
    var ok = await ensureOCR();
    if (!ok) { hideProg(); showToast('文字识别失败，请重试'); return; }
    hideProg();
    showProg('正在生成Excel...', '');

    setTimeout(function() {
      try {
        var XLSX = window.XLSX;
        if (!XLSX) throw new Error('Excel库未加载，请刷新页面重试');
        var wb = XLSX.utils.book_new();
        var hasTable = false;

        for (var pi = 0; pi < ocrResults.length; pi++) {
          var r = ocrResults[pi];
          if (!r || !r.lines) continue;
          r._canvasW = pages[pi].canvas.width;
          r._canvasH = pages[pi].canvas.height;
          var elements = analyzeLayout(r);

          // 收集连续的多列行作为表格块
          var blocks = [];
          var cur = null;
          for (var ei = 0; ei < elements.length; ei++) {
            var el = elements[ei];
            if (el.isMulticol && el.cells && el.cells.length >= 2) {
              if (!cur) cur = [];
              cur.push(el.cells.map(function(c){return c.text.trim();}));
            } else {
              if (cur && cur.length) { blocks.push(cur); cur = null; }
            }
          }
          if (cur && cur.length) blocks.push(cur);

          if (!blocks.length) continue;
          hasTable = true;

          // 把本页所有表格块拼到一个sheet（块之间空一行）
          var aoa = [];
          blocks.forEach(function(block, bi) {
            if (bi > 0) aoa.push([]);
            // 统一列数（取块内最大列数）
            var maxCols = block.reduce(function(m, row){return Math.max(m, row.length);}, 0);
            block.forEach(function(row) {
              while (row.length < maxCols) row.push('');
              aoa.push(row);
            });
          });

          var ws = XLSX.utils.aoa_to_sheet(aoa);
          // 自动列宽
          var colWidths = [];
          aoa.forEach(function(row) {
            row.forEach(function(cell, ci) {
              var len = String(cell || '').length;
              // 中文按2字宽计
              var w = 0;
              for (var cc = 0; cc < String(cell||'').length; cc++) {
                w += String(cell).charCodeAt(cc) > 255 ? 2 : 1;
              }
              colWidths[ci] = Math.max(colWidths[ci]||8, Math.min(w+2, 50));
            });
          });
          ws['!cols'] = colWidths.map(function(w){return {wch: w};});

          var sheetName = '第' + (pi+1) + '页';
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
        }

        if (!hasTable) {
          // 没有识别出表格结构，把所有识别文字按行导出作为兜底
          var fallback = [];
          ocrResults.forEach(function(r, pi) {
            if (!r || !r.lines) return;
            if (fallback.length) fallback.push([]);
            fallback.push(['第' + (pi+1) + '页']);
            r.lines.forEach(function(l) {
              if (l.text && l.text.trim()) fallback.push([l.text.trim()]);
            });
          });
          var ws2 = XLSX.utils.aoa_to_sheet(fallback.length ? fallback : [['未识别到文字']]);
          ws2['!cols'] = [{wch: 80}];
          XLSX.utils.book_append_sheet(wb, ws2, '识别文字');
        }

        var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        var blob = new Blob([wbout], { type: 'application/octet-stream' });
        saveAs(blob, '扫描表格_' + Date.now() + '.xlsx');
        hideProg();
        showToast(hasTable ? 'Excel表格已生成' : '未发现表格结构，已按文字行导出');
      } catch(e) {
        hideProg();
        showToast('Excel生成失败：' + e.message);
      }
    }, 50);
  } catch(e) {
    hideProg();
    showToast('Excel生成失败：' + e.message);
  }
}

// ===== 导出原图Word（底部按钮，不需要OCR，100%原版式）=====
function exportWordImage() {
  if (!pages.length) return;
  showProg('正在生成原图Word...', pages.length + '页');
  setTimeout(function() {
    try {
      var docx = window.docx;
      var children = buildImageWordChildren(docx);
      var doc = new docx.Document({
        sections: [{
          properties: {
            page: {
              size: { width: 11906, height: 16838 },
              margin: { top: 720, bottom: 720, left: 720, right: 720 }
            }
          },
          children: children
        }]
      });
      docx.Packer.toBlob(doc).then(function(blob) {
        saveAs(blob, '扫描件_原图_' + Date.now() + '.docx');
        hideProg();
        showToast('原图Word已生成，共' + pages.length + '页');
      });
    } catch(e) {
      hideProg();
      showToast('Word生成失败：' + e.message);
    }
  }, 100);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}
