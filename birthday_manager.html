<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>生日台账管理</title>
<link rel="icon" type="image/jpeg" href="birthday_icon.jpg">
<link rel="apple-touch-icon" href="birthday_icon.jpg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --p: #6366f1; --g: #10b981; --d: #ef4444; --w: #f59e0b;
  --bg: #f1f5f9; --c: #fff; --t: #1e293b; --ts: #64748b; --bd: #e2e8f0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--t); min-height: 100vh;
  padding: 16px; padding-bottom: 80px;
}
h1 { font-size: 20px; text-align: center; margin-bottom: 16px; color: var(--p); }
.card {
  background: var(--c); border-radius: 12px; padding: 16px;
  margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.btn {
  padding: 10px 16px; border-radius: 8px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-p { background: var(--p); color: #fff; }
.btn-g { background: var(--g); color: #fff; }
.btn-d { background: var(--d); color: #fff; }
.btn-o { background: #fff; color: var(--p); border: 1.5px solid var(--p); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--bd);
  border-radius: 8px; font-size: 14px; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--p); }
.birthday-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--bd);
}
.birthday-item:last-child { border-bottom: none; }
.birthday-info { flex: 1; }
.birthday-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.birthday-detail { font-size: 12px; color: var(--ts); }
.birthday-countdown {
  font-size: 13px; font-weight: 700; padding: 6px 10px;
  border-radius: 20px; white-space: nowrap;
}
.countdown-today { background: var(--w); color: #fff; }
.countdown-soon { background: #fef3c7; color: #92400e; }
.countdown-normal { background: #e0e7ff; color: #3730a3; }
.countdown-past { background: #f1f5f9; color: #64748b; }
.actions { display: flex; gap: 8px; margin-top: 8px; }
.modal-mask {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5); z-index: 1000; display: none;
  align-items: center; justify-content: center; padding: 16px;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--c); border-radius: 14px; width: 100%;
  max-width: 400px; max-height: 90vh; overflow-y: auto;
  padding: 20px; animation: slideUp .2s;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.empty { text-align: center; padding: 40px 20px; color: var(--ts); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; background: #f1f5f9; }
.tab.active { background: var(--p); color: #fff; }
.search-box { margin-bottom: 12px; }
.search-box input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--bd); border-radius: 8px; font-size: 14px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
.tag-lunar { background: #dbeafe; color: #1d4ed8; }
.tag-solar { background: #dcfce7; color: #15803d; }
.fab {
  position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
  border-radius: 50%; background: var(--p); color: #fff; border: none;
  font-size: 28px; cursor: pointer; box-shadow: 0 4px 12px rgba(99,102,241,.4);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8); z-index: 2000;
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 40px; height: 40px; border: 4px solid var(--bd);
  border-top-color: var(--p); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--ts); }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--t); color: #fff; padding: 10px 20px;
  border-radius: 8px; font-size: 14px; z-index: 3000;
  opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
@media (max-width: 768px) {
  body { padding: 12px; padding-bottom: 80px; }
  h1 { font-size: 18px; }
}
</style>
</head>
<body>
<h1>🎂 生日台账管理 <span id="cloudStatus" style="font-size:12px;font-weight:400;color:#9ca3af;vertical-align:middle;margin-left:8px;">连接中...</span></h1>

<div class="card">

<script>
// ========== 国内数据库配置 ==========
const API_URL = 'https://ruilifangfong.site/rest/v1/birthday_book';
let cloudAvailable = true;

function getAuthHeaders() {
  // 优先用登录用户的token，降级用anon key
  var token = null;
  try {
    var keys = Object.keys(localStorage);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].indexOf('auth-token') >= 0 || (keys[i].indexOf('sb-') >= 0 && keys[i].indexOf('auth') >= 0)) {
        var session = JSON.parse(localStorage.getItem(keys[i]));
        if (session && session.access_token) { token = session.access_token; break; }
      }
    }
  } catch(e) {}
  if (token) {
    return { 'apikey': token, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }
  return {
    'apikey': 'eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJpc3MiOiAic3VwYWJhc2UiLCAicmVmIjogImZhbmdkb25nLWxvY2FsIiwgInJvbGUiOiAiYW5vbiIsICJpYXQiOiAxNzg2MDM4ODkxLCAiZXhwIjogMjEwMTM5ODg5MX0.nxnIKzPFgMaawkZ6u_oWICgZqI3c4k1w6OhkwBnL-e8',
    'Authorization': 'Bearer placeholder',
    'Content-Type': 'application/json'
  };
}

function rowToBirthday(r) {
  var b = { id: r.id, name: r.name, type: r.type };
  if (r.type === 'solar') { b.solarMonth = r.solar_month; b.solarDay = r.solar_day; }
  else { b.lunarMonth = r.lunar_month; b.lunarDay = r.lunar_day; }
  return b;
}

function birthdayToRow(b) {
  var row = { name: b.name, type: b.type };
  if (b.type === 'solar') { row.solar_month = b.solarMonth; row.solar_day = b.solarDay; row.lunar_month = null; row.lunar_day = null; }
  else { row.lunar_month = b.lunarMonth; row.lunar_day = b.lunarDay; row.solar_month = null; row.solar_day = null; }
  return row;
}

// ========== 农历转换核心 ==========
const lunarInfo = [
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
  0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
  0x0d520
];
const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const lunarDayNames = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

function leapMonth(y) { return lunarInfo[y-1900] & 0xf; }
function leapDays(y) {
  if(leapMonth(y)) return (lunarInfo[y-1900] & 0x10000) ? 30 : 29;
  return 0;
}
function monthDays(y,m) { return (lunarInfo[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarToSolar(y,m,d) {
  let offset = 0;
  for(let i=1900;i<y;i++) offset += yearDays(i);
  let lm = leapMonth(y);
  for(let i=1;i<m;i++) {
    if(i===lm) offset += leapDays(y);
    offset += monthDays(y,i);
  }
  if(m===lm && d>leapDays(y)) offset += leapDays(y);
  offset += d - 1;
  return new Date(Date.UTC(1900, 0, 31 + offset));
}
function yearDays(y) {
  let sum = 348;
  for(let i=0x8000;i>0x8;i>>=1) sum += (lunarInfo[y-1900] & i) ? 1 : 0;
  return sum + leapDays(y);
}

// ========== 数据管理（Supabase Storage） ==========
let birthdays = [];
let currentFilter = 'all';
let currentEditIndex = -1;
let currentOwnerId = null;
let dataLoaded = false;

// 读取房东系统登录状态
function getCurrentOwnerId() {
  try {
    var keys = Object.keys(localStorage);
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (key.indexOf('auth-token') >= 0 || (key.indexOf('sb-') >= 0 && key.indexOf('auth') >= 0)) {
        var raw = localStorage.getItem(key);
        if (raw) {
          var session = JSON.parse(raw);
          if (session && session.user && session.user.id) {
            return session.user.id;
          }
        }
      }
    }
  } catch(e) {}
  return null;
}

// ========== 数据加载：国内数据库 + localStorage缓存 ==========
function loadFromCloud() {
  if (!currentOwnerId) return Promise.resolve([]);
  return fetch(API_URL + '?owner_id=eq.' + currentOwnerId + '&select=id,name,type,solar_month,solar_day,lunar_month,lunar_day&order=name', {
    headers: getAuthHeaders()
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(rows) {
    return rows.map(rowToBirthday);
  });
}

function saveToCloud(birthdaysArr) {
  if (!currentOwnerId || !cloudAvailable) return Promise.resolve(false);
  // 将完整列表同步到云端：对比已有数据，增删改
  return fetch(API_URL + '?owner_id=eq.' + currentOwnerId + '&select=id,name', {
    headers: getAuthHeaders()
  }).then(function(r) { return r.json(); }).then(function(existing) {
    var existingMap = {};
    existing.forEach(function(e) { existingMap[e.name] = e.id; });
    var promises = [];
    // 新增或更新
    birthdaysArr.forEach(function(b) {
      var row = birthdayToRow(b);
      row.owner_id = currentOwnerId;
      if (existingMap[b.name]) {
        // 更新
        promises.push(fetch(API_URL + '?id=eq.' + existingMap[b.name], {
          method: 'PATCH', headers: getAuthHeaders(), body: JSON.stringify(row)
        }));
        delete existingMap[b.name];
      } else {
        // 新增
        promises.push(fetch(API_URL, {
          method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(row)
        }));
      }
    });
    // 删除云端有但本地没有的
    Object.keys(existingMap).forEach(function(name) {
      promises.push(fetch(API_URL + '?id=eq.' + existingMap[name], {
        method: 'DELETE', headers: getAuthHeaders()
      }));
    });
    return Promise.all(promises);
  }).then(function() { return true; }).catch(function(e) {
    console.warn('云端同步失败:', e.message);
    cloudAvailable = false;
    return false;
  });
}

// 显示/隐藏加载遮罩
function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '加载中...';
  document.getElementById('loadingOverlay').classList.add('show');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

// Toast 提示
function showToast(message, duration) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration || 2000);
}

// 加载数据：localStorage秒开 + 国内数据库后台静默同步
function loadData() {
  loadFromLocalStorage();
  dataLoaded = true;

  if (!currentOwnerId) return;

  loadFromCloud().then(function(cloudData) {
    cloudAvailable = true;
    if (cloudData && cloudData.length > 0) {
      // 合并云端和本地数据（按name去重，云端优先）
      var nameSet = {};
      var merged = [];
      cloudData.forEach(function(b) { if (!nameSet[b.name]) { nameSet[b.name] = true; merged.push(b); } });
      birthdays.forEach(function(b) { if (!nameSet[b.name]) { nameSet[b.name] = true; merged.push(b); } });
      birthdays = merged;
      saveToLocalStorage();
      // 如果有本地新增的数据需要同步到云端
      var localOnly = merged.filter(function(b) { return !b.id; });
      if (localOnly.length > 0) saveToCloud(birthdays);
    } else if (birthdays.length > 0) {
      // 云端无数据但本地有，上传本地数据
      saveToCloud(birthdays);
    }
    if (dataLoaded) renderList();
    var el = document.getElementById('cloudStatus');
    if (el) { el.textContent = '☁️ 云端已同步'; el.style.color = '#059669'; }
  }).catch(function(e) {
    console.warn('云端加载失败:', e.message);
    cloudAvailable = false;
    var el = document.getElementById('cloudStatus');
    if (el) { el.textContent = '📴 本地模式'; el.style.color = '#ef4444'; }
  });
}

function loadFromLocalStorage() {
  try {
    var storageKey = currentOwnerId ? 'birthdays_' + currentOwnerId : 'birthdays_anon';
    var raw = localStorage.getItem(storageKey);
    birthdays = raw ? JSON.parse(raw) : [];
  } catch(e) {
    birthdays = [];
  }
}

function saveToLocalStorage() {
  try {
    var storageKey = currentOwnerId ? 'birthdays_' + currentOwnerId : 'birthdays_anon';
    localStorage.setItem(storageKey, JSON.stringify(birthdays, null, 2));
  } catch(e) {}
}

// 保存数据：localStorage即时生效 + 国内数据库同步
async function saveData() {
  saveToLocalStorage();
  if (cloudAvailable && currentOwnerId) {
    return await saveToCloud(birthdays);
  }
  return true;
}

function getThisYearSolarDate(b) {
  const year = new Date().getFullYear();
  if(b.type === 'solar') {
    return new Date(year, b.solarMonth - 1, b.solarDay);
  } else {
    return lunarToSolar(year, b.lunarMonth, b.lunarDay);
  }
}

function getNextBirthdayDate(b) {
  const today = new Date();
  today.setHours(0,0,0,0);
  let thisYear = getThisYearSolarDate(b);
  thisYear.setHours(0,0,0,0);
  
  if(thisYear >= today) return thisYear;
  
  // 已过，算明年
  const year = new Date().getFullYear() + 1;
  if(b.type === 'solar') {
    return new Date(year, b.solarMonth - 1, b.solarDay);
  } else {
    return lunarToSolar(year, b.lunarMonth, b.lunarDay);
  }
}

function getDaysUntil(b) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const next = getNextBirthdayDate(b);
  return Math.round((next - today) / 86400000);
}

function formatDate(d) {
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatOriginal(b) {
  if(b.type === 'lunar') {
    return `农历${lunarMonthNames[b.lunarMonth-1]}月${lunarDayNames[b.lunarDay-1]}`;
  } else {
    return `公历${b.solarMonth}月${b.solarDay}日`;
  }
}

// ========== UI 渲染 ==========
function escHtml(s){if(s==null)return '';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}

function renderList() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let list = birthdays.filter(b => {
    if(search && !b.name.toLowerCase().includes(search)) return false;
    if(currentFilter === 'lunar') return b.type === 'lunar';
    if(currentFilter === 'solar') return b.type === 'solar';
    if(currentFilter === 'upcoming') return getDaysUntil(b) <= 30;
    return true;
  });
  
  // 按倒计时排序
  list.sort((a,b) => getDaysUntil(a) - getDaysUntil(b));
  
  const container = document.getElementById('birthdayList');
  if(list.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>暂无生日记录</p></div>';
    return;
  }
  
  container.innerHTML = list.map((b, i) => {
    const days = getDaysUntil(b);
    const nextDate = getNextBirthdayDate(b);
    let countdownClass = 'countdown-normal';
    let countdownText = `${days}天后`;
    if(days === 0) { countdownClass = 'countdown-today'; countdownText = '🎂 今天'; }
    else if(days === 1) { countdownClass = 'countdown-today'; countdownText = '明天'; }
    else if(days <= 30) { countdownClass = 'countdown-soon'; }
    
    const tagClass = b.type === 'lunar' ? 'tag-lunar' : 'tag-solar';
    const tagText = b.type === 'lunar' ? '农历' : '公历';
    
    return `<div class="birthday-item" onclick="showDetail(${birthdays.indexOf(b)})">
      <div class="birthday-info">
        <div class="birthday-name">${escHtml(b.name)}<span class="tag ${tagClass}">${tagText}</span></div>
        <div class="birthday-detail">${formatOriginal(b)} → ${formatDate(nextDate)}</div>
      </div>
      <div class="birthday-countdown ${countdownClass}">${countdownText}</div>
    </div>`;
  }).join('');
}

function switchTab(filter) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderList();
}

// ========== 弹窗操作 ==========
function toggleDateInputs() {
  var type = document.getElementById('inputType').value;
  if (type === 'lunar') {
    document.getElementById('lunarInputs').style.display = 'block';
    document.getElementById('solarInputs').style.display = 'none';
  } else {
    document.getElementById('lunarInputs').style.display = 'none';
    document.getElementById('solarInputs').style.display = 'block';
  }
}

function showAddModal() {
  currentEditIndex = -1;
  document.getElementById('modalTitle').textContent = '新增生日';
  document.getElementById('inputName').value = '';
  document.getElementById('inputType').value = 'lunar';
  document.getElementById('inputLunarMonth').value = '1';
  document.getElementById('inputLunarDay').value = '1';
  document.getElementById('inputSolarDate').value = '';
  toggleDateInputs();
  document.getElementById('editModal').classList.add('show');
}

function showDetail(index) {
  const b = birthdays[index];
  const days = getDaysUntil(b);
  const nextDate = getNextBirthdayDate(b);
  const thisYearDate = getThisYearSolarDate(b);
  
  let countdownText = '';
  if(days === 0) countdownText = '🎂 今天就是生日！';
  else if(days === 1) countdownText = '明天过生日';
  else countdownText = `还有 ${days} 天`;
  
  document.getElementById('detailContent').innerHTML = `
    <div style="text-align:center;padding:16px 0">
      <div style="font-size:20px;font-weight:700;margin-bottom:8px">${escHtml(b.name)}</div>
      <div style="font-size:14px;color:var(--ts);margin-bottom:16px">${formatOriginal(b)}</div>
      <div style="background:#fef3c7;border-radius:12px;padding:16px;margin-bottom:16px">
        <div style="font-size:13px;color:#92400e;margin-bottom:4px">下次生日</div>
        <div style="font-size:16px;font-weight:700;color:#92400e">${formatDate(nextDate)}</div>
        <div style="font-size:14px;color:#92400e;margin-top:4px">${countdownText}</div>
      </div>
      <div style="font-size:12px;color:var(--ts)">今年公历：${formatDate(thisYearDate)}</div>
    </div>
  `;
  document.getElementById('detailModal').dataset.index = index;
  document.getElementById('detailModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}

function editCurrent() {
  const index = parseInt(document.getElementById('detailModal').dataset.index);
  closeDetail();
  editBirthday(index);
}

async function deleteCurrent() {
  const index = parseInt(document.getElementById('detailModal').dataset.index);
  if(confirm(`确定删除 ${birthdays[index].name} 的生日记录吗？`)) {
    showLoading('删除中...');
    birthdays.splice(index, 1);
    const success = await saveData();
    hideLoading();
    if (success) {
      closeDetail();
      renderList();
      showToast('已删除');
    } else {
      showToast('删除失败，请重试');
    }
  }
}

function editBirthday(index) {
  currentEditIndex = index;
  const b = birthdays[index];
  document.getElementById('modalTitle').textContent = '编辑生日';
  document.getElementById('inputName').value = b.name;
  document.getElementById('inputType').value = b.type;
  if(b.type === 'lunar') {
    document.getElementById('inputLunarMonth').value = b.lunarMonth;
    document.getElementById('inputLunarDay').value = b.lunarDay;
  } else {
    const mm = String(b.solarMonth).padStart(2, '0');
    const dd = String(b.solarDay).padStart(2, '0');
    document.getElementById('inputSolarDate').value = '2000-' + mm + '-' + dd;
  }
  toggleDateInputs();
  document.getElementById('editModal').classList.add('show');
}

async function saveBirthday() {
  const name = document.getElementById('inputName').value.trim();
  const type = document.getElementById('inputType').value;
  
  if(!name) { alert('请输入姓名'); return; }
  
  let data = { name, type };
  if(type === 'lunar') {
    data.lunarMonth = parseInt(document.getElementById('inputLunarMonth').value);
    data.lunarDay = parseInt(document.getElementById('inputLunarDay').value);
  } else {
    const dateStr = document.getElementById('inputSolarDate').value;
    if(!dateStr) { alert('请选择日期'); return; }
    data.solarMonth = parseInt(dateStr.split('-')[1]);
    data.solarDay = parseInt(dateStr.split('-')[2]);
  }
  
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  showLoading('保存中...');
  
  if(currentEditIndex >= 0) {
    birthdays[currentEditIndex] = data;
  } else {
    birthdays.push(data);
  }
  
  const success = await saveData();
  hideLoading();
  saveBtn.disabled = false;
  
  if (success) {
    closeModal();
    renderList();
    showToast('已保存');
  } else {
    // 回滚
    if(currentEditIndex >= 0) {
      // 编辑失败，需要重新加载原始数据
      await loadData();
    } else {
      // 新增失败，移除刚添加的
      birthdays.pop();
    }
    showToast('保存失败，请重试');
  }
}

// ========== 初始化 ==========
function init() {
  currentOwnerId = getCurrentOwnerId();
  
  // loadData 秒级完成（localStorage），云端在后台静默同步
  loadData();
  
  renderList();
  
  // 初始状态提示（云端结果稍后回来会更新）
  var statusEl = document.getElementById('cloudStatus');
  setTimeout(function() {
    if (cloudAvailable) {
      if (statusEl) { statusEl.textContent = '☁️ 云端已同步'; statusEl.style.color = '#059669'; }
    } else {
      if (statusEl) { statusEl.textContent = '📴 本地模式'; statusEl.style.color = '#ef4444'; }
    }
  }, 3000);
}

init();
